<style>
  /* Variant H · «Rellotge»: el dia com una esfera de 24 hores. Comerços oberts, activitats i busos són arcs i marques;
     la busca es gira (amb el dit, el ratolí o les fletxes) i el panell diu què passa a aquella hora. */
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #16181d; --ink-2: #41454d; --ink-3: #61666f; --line: #e2e0d9; --face: #ffffff; --tick: #b9b6ad;
    --hand: #2e4bff; --coral: #ff6b4a; --sun: #f0ad00; --bus: #2e4bff; --mint: #14a36a; --lilac: #8a6cf0;
    --sans: 'Manrope', ui-sans-serif, system-ui, sans-serif; --mono: 'Spline Sans Mono', ui-monospace, monospace; --tap: 46px; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1013; --card: #181a1f; --ink: #f1f0ec; --ink-2: #c8c9cd; --ink-3: #9a9ca3; --line: #2a2c33; --face: #15171b; --tick: #4a4d55; --hand: #8b9bff; --bus: #8b9bff; --coral: #ff8c70; --sun: #ffc93d; --mint: #4fd69c; --lilac: #ad98ff; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #0f1013; --card: #181a1f; --ink: #f1f0ec; --ink-2: #c8c9cd; --ink-3: #9a9ca3; --line: #2a2c33; --face: #15171b; --tick: #4a4d55; --hand: #8b9bff; --bus: #8b9bff; --coral: #ff8c70; --sun: #ffc93d; --mint: #4fd69c; --lilac: #ad98ff; color-scheme: dark; }
  html[data-text="l"] { font-size: 112.5%; } html[data-text="xl"] { font-size: 125%; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 1.0625rem/1.5 var(--sans); }
  h1, h2, h3, p { margin: 0; } button, input { font: inherit; color: inherit; } button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--hand); outline-offset: 3px; border-radius: 10px; }
  .wrap { max-width: 72rem; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(2.5rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-block: 18px 6px; }
  .brand { font: 800 1.375rem var(--sans); letter-spacing: -0.03em; display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 28px; height: 28px; }
  .hbtn { min-height: var(--tap); padding: 0 16px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); font-weight: 700; }
  .grid { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 60rem) { .grid { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); margin-top: 10px; } }
  .dialbox { position: relative; }
  svg.dial { width: 100%; max-width: 34rem; display: block; margin: 0 auto; touch-action: none; user-select: none; }
  .face { fill: var(--face); stroke: var(--line); }
  .tick { stroke: var(--tick); } .tick.maj { stroke: var(--ink-3); stroke-width: 2; }
  .hl { font: 600 12px var(--mono); fill: var(--ink-3); }
  .lane { fill: none; stroke: var(--line); }
  .arc { fill: none; stroke-linecap: round; }
  .now-dot { fill: var(--coral); }
  .hand { stroke: var(--hand); stroke-width: 3; stroke-linecap: round; }
  .knob { fill: var(--hand); cursor: grab; } .knob:active { cursor: grabbing; }
  .knob-ring { fill: none; stroke: var(--hand); stroke-opacity: 0.25; stroke-width: 10; }
  .ct { font: 700 38px var(--mono); fill: var(--ink); letter-spacing: -2px; }
  .cs { font: 600 11px var(--mono); fill: var(--ink-3); letter-spacing: 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; margin-top: 10px; font-size: 0.875rem; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; } .legend i { width: 18px; height: 6px; border-radius: 99px; background: var(--c); }
  .day { display: inline-flex; padding: 4px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); }
  .day button { min-height: 40px; padding: 0 16px; border: 0; border-radius: 99px; background: none; font-weight: 700; color: var(--ink-2); }
  .day button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .panel { display: grid; gap: 14px; }
  .at { font: 800 clamp(2.2rem, 1.6rem + 3vw, 3.4rem)/1 var(--sans); letter-spacing: -0.04em; }
  .at small { display: block; font: 600 0.75rem var(--mono); letter-spacing: 0.14em; color: var(--ink-3); margin-bottom: 8px; text-transform: uppercase; }
  .group { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 6px 16px; }
  .group h2 { font: 600 0.75rem var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); padding: 12px 0 4px; display: flex; align-items: center; gap: 8px; }
  .group h2 i { width: 10px; height: 10px; border-radius: 99px; background: var(--c); }
  .it { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .it:first-of-type { border-top: 0; }
  .it .tm { font: 600 0.9375rem var(--mono); min-width: 5.5rem; color: var(--ink-2); }
  .it b { display: block; font-weight: 700; line-height: 1.25; } .it small { color: var(--ink-3); }
  .it .go { margin-left: auto; min-height: 40px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: none; font-weight: 700; white-space: nowrap; }
  .it .go[aria-pressed="true"] { background: var(--mint); border-color: var(--mint); color: #04150d; }
  .none { padding: 12px 0; color: var(--ink-3); }
  .ask { display: flex; gap: 8px; } .ask input { flex: 1; min-width: 0; min-height: var(--tap); border-radius: 99px; border: 1px solid var(--line); background: var(--card); padding: 0 16px; outline: none; }
  .ask input:focus { border-color: var(--hand); } .ask button { min-height: var(--tap); padding: 0 18px; border-radius: 99px; border: 0; background: var(--ink); color: var(--bg); font-weight: 700; }
  .ans { padding: 14px 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
  .ans ul { padding-left: 20px; margin: 6px 0 0; } .ans p + p { margin-top: 8px; }
  .demo { display: inline-flex; font: 600 0.6875rem var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); border: 1px dashed var(--ink-3); padding: 1px 6px; border-radius: 4px; }
  .sheet { position: fixed; z-index: 50; inset: auto 0 0 0; padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); background: var(--card); border-top: 1px solid var(--line); border-radius: 26px 26px 0 0; transform: translateY(105%); transition: transform 0.3s; box-shadow: 0 -20px 50px rgb(0 0 0 / 0.2); }
  .sheet.on { transform: none; } .sheet > div { max-width: 32rem; margin: 0 auto; display: grid; gap: 12px; }
  .sheet input { min-height: var(--tap); border-radius: 14px; border: 1px solid var(--line); background: var(--bg); padding: 0 14px; }
  #toast { position: fixed; z-index: 60; left: 50%; top: 16px; translate: -50% -10px; opacity: 0; padding: 10px 16px; border-radius: 99px; background: var(--ink); color: var(--bg); font-weight: 700; transition: 0.25s; pointer-events: none; }
  #toast.on { opacity: 1; translate: -50% 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header><span class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M16 16V6" stroke="#2e4bff" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="2.5" fill="currentColor"/></svg>Súria</span>
    <div class="day" role="group" aria-label="Dia"><button data-day="0" aria-pressed="true">Avui</button><button data-day="1" aria-pressed="false">Demà</button></div>

      <svg class="dial" id="dial" viewBox="0 0 400 400"></svg>

<script>
// Motor comú dels prototips: dades d'exemple, estat al dispositiu, assistent de demostració i petites utilitats.
// Tot el contingut és D'EXEMPLE (no són dades reals de Súria).
const SURIA = (() => {
  const KEY = 'suria-variant-' + (document.documentElement.dataset.variant || 'x');
  const fresh = () => ({ user: null, going: {}, thanks: {}, buddy: {}, votes: {}, posts: [], text: 'm', chat: [] });
  let st = fresh();
  try { st = { ...fresh(), ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch (e) { /* sense emmagatzematge */ }
  const subs = new Set();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* opcional */ } subs.forEach((f) => f(st)); };
  const state = { get: () => st, set(fn) { fn(st); save(); }, on(f) { subs.add(f); } };

  const DOW = ['diumenge', 'dilluns', 'dimarts', 'dimecres', 'dijous', 'divendres', 'dissabte'];
  const DOWS = ['dg', 'dl', 'dt', 'dc', 'dj', 'dv', 'ds'];
  const MON = ['gener', 'febrer', 'març', 'abril', 'maig', 'juny', 'juliol', 'agost', 'setembre', 'octubre', 'novembre', 'desembre'];
  const day = (n) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + n); return d; };
  const cap = (s) => s[0].toUpperCase() + s.slice(1);
  const dayLabel = (n) => (n === 0 ? 'Avui' : n === 1 ? 'Demà' : `${cap(DOW[day(n).getDay()])} ${day(n).getDate()}`);
  const longDate = (d = new Date()) => `${cap(DOW[d.getDay()])}, ${d.getDate()} ${['març', 'abril', 'agost', 'octubre'].includes(MON[d.getMonth()]) ? 'd’' : 'de '}${MON[d.getMonth()]}`;
  const hhmm = (d = new Date()) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  const greet = () => { const h = new Date().getHours(); return h < 6 ? 'Bona nit' : h < 14 ? 'Bon dia' : h < 20 ? 'Bona tarda' : 'Bon vespre'; };

  const events = [
    { id: 'passeig', d: 0, h: '10:00', end: '11:30', cat: 'Natura', tone: 'mint', t: 'Passeig a ritme lent pel riu', l: 'Pont vell', going: 18, first: true, x: 'El grup espera cinc minuts. El ritme el marca qui va més a poc a poc. A la meitat hi ha bancs.' },
    { id: 'tauletes', d: 0, h: '17:00', end: '18:30', cat: 'Gent gran', tone: 'coral', t: 'Tarda de tauletes i mòbils', l: 'Biblioteca', going: 12, first: true, x: 'Entres, et donen un cafè i et presenten qui t’ajudarà. Pots preguntar el mateix deu vegades.' },
    { id: 'contes', d: 1, h: '17:30', end: '18:15', cat: 'Famílies', tone: 'sky', t: 'Contes amb llanterna', l: 'Biblioteca infantil', going: 29, x: 'Infants a terra amb coixins, famílies al darrere. Uns 40 minuts.' },
    { id: 'cor', d: 1, h: '20:00', end: '21:30', cat: 'Cultura', tone: 'sun', t: 'Assaig obert del cor', l: 'Casal cultural', going: 23, first: true, x: 'Seus al fons. Al descans et pregunten si vols provar. Dir que no també està bé.' },
    { id: 'sopar', d: 3, h: '20:30', end: '22:30', cat: 'Veïnat', tone: 'lilac', t: 'Sopar de benvinguda als nous veïns', l: 'Casal cultural', going: 41, first: true, x: 'Algú t’espera a la porta i et presenta gent. Taules llargues, sense lloc fix.' },
    { id: 'mercat', d: 4, h: '10:00', end: '20:00', cat: 'Mercat', tone: 'sun', t: 'Mercat d’hivern de productors', l: 'Plaça major', going: 134, x: 'Al matí és més tranquil. A la tarda hi ha música.' },
    { id: 'ball', d: 5, h: '17:00', end: '19:30', cat: 'Gent gran', tone: 'coral', t: 'Ball de diumenge', l: 'Casal de la gent gran', going: 52, x: 'Comença amb peces lentes. Hi ha cadires a tot el voltant.' },
    { id: 'reparem', d: 7, h: '10:00', end: '13:00', cat: 'Veïnat', tone: 'lilac', t: 'Reparem junts', l: 'Taller del casal', going: 15, first: true, x: 'T’apuntes a l’entrada i esperes torn amb un cafè.' },
  ];
  const posts = [
    { id: 'p1', a: 'Irene V.', i: 'IV', tone: 'sky', badge: 'Nova veïna', ch: 'Hola, sóc nova', m: 22, t: 'Fa un mes que vivim aquí amb la meva filla de 5 anys. Busquem un parc tranquil per les tardes i, si hi ha altres famílies noves, ens encantaria conèixer-vos.', th: 21, r: [['RM', 'coral', 'Rosa', 'Els divendres som unes quantes famílies al parc del riu cap a les sis.']] },
    { id: 'p2', a: 'Toni R.', i: 'TR', tone: 'coral', ch: 'Avís', m: 70, t: 'Ojo: esta mañana hay obras en la entrada del pueblo y un solo carril. Salid con tiempo.', th: 36, r: [['MF', 'lilac', 'Marta', 'Gràcies! A les 8 ja hi havia cua.']] },
    { id: 'p3', a: 'Associació de veïns', i: 'AV', tone: 'mint', badge: 'Entitat', ch: 'Dono un cop de mà', m: 1500, t: 'Busquem dues persones per acompanyar a comprar, un matí a la setmana, veïnes grans que viuen soles.', th: 48, r: [['IV', 'sky', 'Irene', 'Jo puc els dimecres!']] },
    { id: 'p4', a: 'Montse C.', i: 'MC', tone: 'lilac', ch: 'Perdut i trobat', m: 200, t: 'He trobat unes ulleres de lectura amb funda vermella al banc de la plaça.', th: 14, r: [] },
  ];
  const shops = [
    { id: 'forn', n: 'Forn de l’Alba', k: 'Forn', tone: 'sun', o: [['07:00', '14:00'], ['17:00', '20:00']], offer: 'Dijous: segona barra a meitat de preu' },
    { id: 'cafe', n: 'Cafè de la Plaça', k: 'Bar', tone: 'coral', o: [['07:00', '20:00']], offer: 'Menú del dia: 13,50 €', featured: true },
    { id: 'hort', n: 'L’Hort Verd', k: 'Fruita', tone: 'mint', o: [['08:30', '13:30'], ['17:00', '20:00']], offer: 'Entrega gratis a gent gran' },
    { id: 'taverna', n: 'La Taverna del Pont', k: 'Tapes', tone: 'coral', o: [['12:00', '16:00'], ['19:30', '23:00']], offer: 'Dimecres: tapa + canya, 4 €' },
  ];
  const proposal = { t: 'Més bancs a la pujada del centre', n: 212, goal: 250 };
  const bus = ['06:50', '07:55', '08:40', '09:55', '11:00', '12:05', '13:10', '14:50', '16:25', '17:20', '18:45', '19:45'];
  const nextBus = (k = 3) => bus.filter((b) => b >= hhmm()).slice(0, k);
  const minsTo = (b) => { const [h, m] = b.split(':').map(Number); const n = new Date(); return h * 60 + m - (n.getHours() * 60 + n.getMinutes()); };
  const isOpen = (s) => s.o.some(([a, b]) => hhmm() >= a && hhmm() < b);
  const t24 = (x) => x.replace(':', '.');

  const norm = (s) => s.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
  const has = (q, ...w) => w.some((x) => new RegExp(`(^|[^a-z0-9])${x}`).test(q));
  function answer(raw) {
    const q = norm(raw);
    if (has(q, 'bus', 'autobus', 'manresa')) {
      const n = nextBus();
      return { text: n.length ? `El pròxim bus cap a Manresa surt a les **${t24(n[0])} h** (d’aquí a ${minsTo(n[0])} min).\nDesprés: ${n.slice(1).map(t24).join(', ')} h.\n\nHorari d’exemple del prototip.` : 'Avui ja no surten més busos cap a Manresa. El primer de demà és a les **6.50 h**.', actions: [] };
    }
    if (has(q, 'empadron', 'padro', 'padron')) return { text: '**Empadronar-te** és la porta de tot: metge, escola i ajuts.\n- Porta el DNI o NIE i el contracte de lloguer.\n- Fes-ho en línia o a l’oficina d’atenció ciutadana.\n- Guarda el justificant: te’l demanaran al CAP.', actions: [['Guia pas a pas', '#jo']] };
    if (has(q, 'moble', 'mueble', 'sofa', 'matalas', 'colchon')) return { text: 'Els mobles es recullen **a la porta**, demanant-ho amb una setmana d’antelació. Deixa’ls la nit abans, al costat de la porta.', actions: [] };
    if (has(q, 'farmac', 'guardia')) return { text: 'Farmàcia de guàrdia (dada d’exemple): **Farmàcia de la Plaça**, fins demà a les 9.00 h.\nSi és una urgència, truca al **112**.', actions: [['Truca al 112', 'tel:112']] };
    if (has(q, 'sopar', 'cenar', 'obert', 'abierto', 'menjar', 'comer', 'tapes', 'pa(?![a-z])', 'forn', 'cafe')) {
      const o = shops.filter(isOpen);
      return { text: (o.length ? 'Obert ara, segons el que diuen els mateixos negocis:\n' : 'Ara està tot tancat. Aquests obren aviat:\n') + (o.length ? o : shops).map((s) => `- **${s.n}** · ${s.offer}`).join('\n'), actions: [] };
    }
    if (has(q, 'que fer', 'que faig', 'que hacer', 'agenda', 'cap de setmana', 'fin de semana', 'avui', 'hoy', 'activitat')) {
      return { text: 'Això és el que hi ha aviat:\n' + events.slice(0, 4).map((e) => `- **${e.t}** · ${dayLabel(e.d)}, ${t24(e.h)} h · ${e.l}`).join('\n') + '\n\nA cada activitat t’expliquem què passarà i pots dir que busques companyia.', actions: [['Obre l’agenda', '#agenda']] };
    }
    if (has(q, 'nou', 'nueva', 'nuevo', 'acabo', 'arribat', 'gent', 'amics', 'amigos')) return { text: 'Benvingut! Aquesta setmana hi ha un **sopar de benvinguda** on algú t’esperarà a la porta per presentar-te gent. I tens una guia dels primers 30 dies.', actions: [['Sopar de benvinguda', '#agenda/sopar']] };
    if (has(q, '112', 'emergenc', 'urgenc', 'policia')) return { text: 'En una emergència, truca al **112**: gratuït i 24 hores.', actions: [['Truca al 112', 'tel:112']] };
    return { text: 'Encara no tinc aquesta resposta: funciono en **mode demostració**, sense cap model d’IA connectat, i només responc amb el que hi ha a la plataforma.\n\nPots preguntar-ho a la comunitat: algú del poble ho sabrà.', actions: [['Pregunta-ho a la comunitat', '#comunitat']] };
  }
  async function stream(text, onChunk, signal) {
    const wait = (ms) => new Promise((res, rej) => { const id = setTimeout(res, ms); signal && signal.addEventListener('abort', () => { clearTimeout(id); rej(new Error('abort')); }, { once: true }); });
    await wait(500);
    let out = '';
    for (const w of text.match(/\S+\s*/g) || []) { await wait(14 + Math.random() * 24); out += w; onChunk(out); }
    return out;
  }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const md = (t) => {
    const lines = esc(t).split('\n'); let h = ''; let ul = false;
    for (const l of lines) {
      const f = l.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      if (l.startsWith('- ')) { if (!ul) { h += '<ul>'; ul = true; } h += `<li>${f.slice(2)}</li>`; }
      else { if (ul) { h += '</ul>'; ul = false; } if (l.trim()) h += `<p>${f}</p>`; }
    }
    return h + (ul ? '</ul>' : '');
  };
  let tt;
  const toast = (m) => { const el = document.getElementById('toast'); if (!el) return; el.textContent = m; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2400); };
  const initials = (n) => { const p = n.trim().split(/\s+/); return ((p[0] || '')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); };
  const ago = (m) => (m < 60 ? `fa ${m} min` : m < 1440 ? `fa ${Math.round(m / 60)} h` : m < 2880 ? 'ahir' : `fa ${Math.round(m / 1440)} dies`);
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  return { state, events, posts, shops, proposal, nextBus, minsTo, isOpen, t24, dayLabel, longDate, greet, answer, stream, md, esc, toast, initials, ago, day, DOWS, reduced, hhmm };
})();

const S = SURIA, $ = (q) => document.querySelector(q);
document.documentElement.dataset.text = S.state.get().text;
const C = 200, toMin = (s) => { const [h, m] = s.split(':').map(Number); return h * 60 + m; }, hm = (m) => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const ang = (m) => (m / 1440) * 2 * Math.PI - Math.PI / 2, pt = (r, m) => [C + r * Math.cos(ang(m)), C + r * Math.sin(ang(m))];
function arc(r, a, b) { const [x1, y1] = pt(r, a), [x2, y2] = pt(r, b); return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${b - a > 720 ? 1 : 0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; }
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
let t = nowMin(), day = 0;
const BUS = ['06:50', '07:55', '08:40', '09:55', '11:00', '12:05', '13:10', '14:50', '16:25', '17:20', '18:45', '19:45'];
const evsDay = () => S.events.filter((e) => e.d === day);
function drawStatic() {
  let s = `<circle class="face" cx="200" cy="200" r="194"/>`;
  for (let h = 0; h < 24; h++) { const [x1, y1] = pt(194, h * 60), [x2, y2] = pt(h % 3 ? 186 : 180, h * 60); s += `<line class="tick ${h % 3 ? '' : 'maj'}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; if (h % 3 === 0) { const [tx, ty] = pt(168, h * 60); s += `<text class="hl" x="${tx}" y="${ty + 4}" text-anchor="middle">${String(h).padStart(2, '0')}</text>`; } }
  S.shops.forEach((sh, i) => { const r = 150 - i * 10; s += `<circle class="lane" cx="200" cy="200" r="${r}" stroke-width="7"/>`; sh.o.forEach(([a, b]) => { s += `<path class="arc" d="${arc(r, toMin(a), toMin(b))}" stroke="var(--coral)" stroke-width="7" opacity="${0.55 + i * 0.12}"><title>${sh.n}: ${S.t24(a)}–${S.t24(b)}</title></path>`; }); });
  s += `<circle class="lane" cx="200" cy="200" r="104" stroke-width="14"/>`;
  evsDay().forEach((e) => { s += `<path class="arc" d="${arc(104, toMin(e.h), toMin(e.end))}" stroke="var(--sun)" stroke-width="14"><title>${e.t}</title></path>`; });
  BUS.forEach((b) => { const [x1, y1] = pt(84, toMin(b)), [x2, y2] = pt(94, toMin(b)); s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--bus)" stroke-width="3" stroke-linecap="round"/>`; });
  s += `<circle cx="200" cy="200" r="76" fill="none" stroke="var(--mint)" stroke-width="3" stroke-dasharray="2 5"/>`;
  if (day === 0) { const [nx, ny] = pt(194, nowMin()); s += `<circle class="now-dot" cx="${nx}" cy="${ny}" r="5"><title>Ara</title></circle>`; }
  s += `<g id="handg"></g><text class="ct" id="ct" x="200" y="206" text-anchor="middle"></text><text class="cs" id="cs" x="200" y="230" text-anchor="middle"></text>`;
  $('#dial').innerHTML = s;
}
function drawHand() {
  const [x, y] = pt(186, t), [x0, y0] = pt(66, t);
  $('#handg').innerHTML = `<line class="hand" x1="${x0}" y1="${y0}" x2="${x}" y2="${y}"/><circle class="knob-ring" cx="${x}" cy="${y}" r="14"/><circle class="knob" id="knob" cx="${x}" cy="${y}" r="9" tabindex="0" role="slider" aria-label="Hora" aria-valuemin="0" aria-valuemax="1435" aria-valuenow="${t}" aria-valuetext="${S.t24(hm(t))} h"/>`;
  $('#ct').textContent = S.t24(hm(t));
  $('#cs').textContent = day === 0 ? (Math.abs(t - nowMin()) < 6 ? 'ARA' : 'AVUI') : 'DEMÀ';
  $('#knob').onkeydown = (e) => { const d = { ArrowRight: 15, ArrowUp: 15, ArrowLeft: -15, ArrowDown: -15, PageUp: 60, PageDown: -60 }[e.key]; if (d) { e.preventDefault(); setT(t + d); $('#knob').focus(); } };
}
function setT(m) { t = ((Math.round(m / 5) * 5) % 1440 + 1440) % 1440; drawHand(); panel(); }
function panel() {
  const T = hm(t);
  $('#at').innerHTML = `<small>${day === 0 ? 'Avui' : 'Demà'} a les</small>${S.t24(T)} h`;
  const open = S.shops.filter((s) => s.o.some(([a, b]) => T >= a && T < b));
  const evNow = evsDay().filter((e) => T >= e.h && T <= e.end), evNext = evsDay().filter((e) => e.h > T).slice(0, 2);
  const bus = BUS.filter((b) => b >= T).slice(0, 2);
  const goBtn = (e) => { const on = !!S.state.get().going[e.id]; return `<button class="go" data-go="${e.id}" aria-pressed="${on}">${on ? '✓ Hi vas' : 'Hi vaig'}</button>`; };
  $('#groups').innerHTML = `
    <div class="group" style="--c:var(--sun)"><h2><i></i>Activitats</h2>${evNow.map((e) => `<div class="it"><span class="tm">ARA</span><span><b>${e.t}</b><small>${e.l} · fins a les ${S.t24(e.end)}</small></span>${goBtn(e)}</div>`).join('')}${evNext.map((e) => `<div class="it"><span class="tm">${S.t24(e.h)}</span><span><b>${e.t}</b><small>${e.l}${e.first ? ' · 1a vegada' : ''}</small></span>${goBtn(e)}</div>`).join('') || (evNow.length ? '' : '<p class="none">Cap activitat més aquest dia.</p>')}</div>
    <div class="group" style="--c:var(--coral)"><h2><i></i>Obert a aquesta hora · ${open.length}/${S.shops.length}</h2>${open.map((s) => `<div class="it"><span class="tm">fins ${S.t24(s.o.find(([a, b]) => T >= a && T < b)[1])}</span><span><b>${s.n}</b><small>${s.offer}</small></span></div>`).join('') || '<p class="none">Tot tancat. Mou la busca per veure quan obren.</p>'}</div>
    <div class="group" style="--c:var(--bus)"><h2><i></i>Bus a Manresa</h2>${bus.map((b) => `<div class="it"><span class="tm">${S.t24(b)}</span><span><b>Estació d’autobusos</b><small>${day === 0 && Math.abs(t - nowMin()) < 6 ? `d’aquí a ${toMin(b) - t} min` : 'horari d’exemple'}</small></span></div>`).join('') || '<p class="none">Ja no en surten més aquest dia.</p>'}</div>`;
}
function fromPointer(e) { const r = $('#dial').getBoundingClientRect(); const x = (e.clientX - r.left) / r.width * 400 - C, y = (e.clientY - r.top) / r.height * 400 - C; let a = Math.atan2(y, x) + Math.PI / 2; if (a < 0) a += 2 * Math.PI; setT(a / (2 * Math.PI) * 1440); }
let dragging = false;
$('#dial').addEventListener('pointerdown', (e) => { dragging = true; $('#dial').setPointerCapture(e.pointerId); fromPointer(e); });
$('#dial').addEventListener('pointermove', (e) => dragging && fromPointer(e));
$('#dial').addEventListener('pointerup', () => { dragging = false; });
function sheet(html) { $('#sbody').innerHTML = html + '<button class="hbtn" id="close">Tanca</button>'; $('#sheet').classList.add('on'); setTimeout(() => $('#sbody').querySelector('input,button')?.focus(), 50); }
const close = () => $('#sheet').classList.remove('on');
function needUser() {
  if (S.state.get().user) return false;
  sheet(`<h2 style="font:800 1.75rem var(--sans)">Com et diuen?</h2><p style="color:var(--ink-2)">Només el nom, per apuntar-te i que els veïns sàpiguen qui hi va.</p><form id="si" style="display:grid;gap:10px"><label for="nm" style="font-weight:700">Nom i cognom</label><input id="nm" autocomplete="name" placeholder="Marta Puig"><button class="hbtn" style="background:var(--ink);color:var(--bg)">Entra</button></form>`);
  $('#si').onsubmit = (e) => { e.preventDefault(); const n = $('#nm').value.trim(); if (n.length < 2) return; S.state.set((s) => { s.user = { n, i: S.initials(n) }; }); $('#me').textContent = n.split(' ')[0]; close(); S.toast(`Hola, ${n.split(' ')[0]}`); };
  return true;
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.day) { day = Number(b.dataset.day); document.querySelectorAll('[data-day]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); drawStatic(); setT(day === 0 ? nowMin() : 600); return; }
  if (b.dataset.go) { if (needUser()) return; const id = b.dataset.go; S.state.set((s) => { s.going[id] ? delete s.going[id] : (s.going[id] = 1); }); S.toast(S.state.get().going[id] ? 'Apuntat' : 'Ja no hi vas'); panel(); return; }
  if (b.id === 'me') { if (needUser()) return; sheet(`<h2 style="font:800 1.75rem var(--sans)">${S.esc(S.state.get().user.n)}</h2><p style="font-weight:700">Mida del text</p><div style="display:flex;gap:8px">${[['m', 'A'], ['l', 'A+'], ['xl', 'A++']].map(([k, l]) => `<button class="hbtn" data-size="${k}" aria-pressed="${S.state.get().text === k}">${l}</button>`).join('')}</div><button class="hbtn" id="logout">Surt</button>`); return; }
  if (b.dataset.size) { S.state.set((s) => { s.text = b.dataset.size; }); document.documentElement.dataset.text = b.dataset.size; return; }
  if (b.id === 'logout') { S.state.set((s) => { s.user = null; }); $('#me').textContent = 'Compte'; close(); return; }
  if (b.id === 'close') close();
});
$('#af').addEventListener('submit', async (e) => { e.preventDefault(); const q = $('#aq').value.trim(); if (!q) return; const a = S.answer(q); $('#ans').innerHTML = `<div class="ans"><p style="font:600 .75rem var(--mono);color:var(--ink-3);letter-spacing:.08em">«${S.esc(q)}»</p><div id="at2"></div></div>`; await S.stream(a.text, (x) => { $('#at2').innerHTML = S.md(x); }); });
document.addEventListener('keydown', (e) => e.key === 'Escape' && close());
if (S.state.get().user) $('#me').textContent = S.state.get().user.n.split(' ')[0];
drawStatic(); setT(t);
</script>
