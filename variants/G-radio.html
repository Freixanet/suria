<title>Ràdio Súria</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&family=DM+Mono:wght@400;500&display=swap">
<script>document.documentElement.dataset.variant = 'radio';</script>
<style>
  /* Variant G · «Ràdio»: el poble s'escolta. Un dial d'emissores (el dia, agenda, veïns, comerç i estudi), veu i subtítols.
     Aspecte únic de ràdio de baquelita: fosc càlid amb llum d'ambre, colors explícits independents del tema de l'amfitrió. */
  :root {
    --bg: #14100d; --bg-2: #1e1814; --panel: #241d18; --line: rgb(243 233 216 / 0.12); --cream: #f3e9d8; --cream-2: #cbbfae; --cream-3: #9e9384;
    --amber: #ffb547; --amber-soft: rgb(255 181 71 / 0.16); --red: #ff5b3d; --mint: #7ad9a8;
    --sans: 'DM Sans', ui-sans-serif, system-ui, sans-serif; --mono: 'DM Mono', ui-monospace, monospace; --tap: 48px; color-scheme: dark;
  }
  html[data-text="l"] { font-size: 112.5%; } html[data-text="xl"] { font-size: 125%; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--cream); font: 1.0625rem/1.55 var(--sans); background-image: radial-gradient(60rem 30rem at 50% -10%, rgb(255 181 71 / 0.12), transparent 70%); }
  h1, h2, h3, p { margin: 0; } button, input { font: inherit; color: inherit; } button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 10px; }
  .wrap { max-width: 44rem; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(3rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 20px 10px; }
  .brand { font: 800 1.5rem var(--sans); letter-spacing: -0.03em; }
  .brand small { display: block; font: 500 0.75rem var(--mono); letter-spacing: 0.14em; color: var(--cream-3); text-transform: uppercase; }
  .live { display: inline-flex; align-items: center; gap: 8px; font: 500 0.8125rem var(--mono); color: var(--cream-2); padding: 8px 12px; border: 1px solid var(--line); border-radius: 99px; }
  .live::before { content: ''; width: 9px; height: 9px; border-radius: 99px; background: var(--red); box-shadow: 0 0 12px var(--red); }
  @media (prefers-reduced-motion: no-preference) { .live::before { animation: blink 1.6s infinite; } @keyframes blink { 50% { opacity: 0.35; } } }
  .me { width: var(--tap); height: var(--tap); border-radius: 99px; border: 1px solid var(--line); background: var(--panel); font-weight: 700; }
  .radio { margin-top: 10px; border-radius: 28px; padding: 18px; background: linear-gradient(180deg, #2b221c, #1b1612); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.06), 0 30px 60px -30px #000; }
  .dialwin { position: relative; height: 104px; border-radius: 16px; background: linear-gradient(180deg, #2d2014, #1c140d); box-shadow: inset 0 0 0 1px rgb(255 181 71 / 0.25), inset 0 0 40px rgb(255 181 71 / 0.15); overflow: hidden; }
  .band { position: absolute; inset: 0; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; }
  .band::-webkit-scrollbar { display: none; }
  .scale { position: relative; height: 100%; }
  .tick { position: absolute; bottom: 0; width: 1px; background: rgb(255 181 71 / 0.45); }
  .num { position: absolute; top: 14px; translate: -50% 0; font: 500 0.75rem var(--mono); color: rgb(255 181 71 / 0.75); }
  .st { position: absolute; top: 36px; translate: -50% 0; scroll-snap-align: center; border: 0; background: none; font: 700 0.8125rem var(--sans); color: var(--cream-2); letter-spacing: 0.02em; white-space: nowrap; padding: 6px 8px; border-radius: 8px; }
  .st[aria-pressed="true"] { color: var(--amber); text-shadow: 0 0 12px rgb(255 181 71 / 0.6); }
  .needle { position: absolute; left: 50%; top: 6px; bottom: 6px; width: 2px; background: var(--red); box-shadow: 0 0 10px var(--red); translate: -50% 0; pointer-events: none; }
  .tune { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; margin-top: 16px; }
  .knob { width: 56px; height: 56px; border-radius: 50%; border: 0; background: radial-gradient(circle at 35% 30%, #4a3a2e, #1d1611 70%); box-shadow: 0 6px 14px rgb(0 0 0 / 0.6), inset 0 1px 0 rgb(255 255 255 / 0.1); font-size: 1.25rem; color: var(--cream-2); }
  .freq { text-align: center; } .freq b { display: block; font: 500 2.4rem/1 var(--mono); color: var(--amber); letter-spacing: -0.04em; text-shadow: 0 0 18px rgb(255 181 71 / 0.45); }
  .freq span { font: 500 0.8125rem var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--cream-2); }
  .player { margin-top: 18px; display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
  .play { width: 76px; height: 76px; border-radius: 50%; border: 0; background: var(--amber); color: #1b1206; font-size: 1.75rem; box-shadow: 0 0 0 8px var(--amber-soft); }
  .wave { display: flex; align-items: center; gap: 3px; height: 54px; }
  .wave i { flex: 1; max-width: 6px; border-radius: 99px; background: rgb(255 181 71 / 0.35); height: 20%; }
  @media (prefers-reduced-motion: no-preference) { .on .wave i { animation: w 0.9s ease-in-out infinite alternate; background: var(--amber); } @keyframes w { from { height: 15%; } to { height: 100%; } } }
  .now { margin-top: 22px; }
  .now .eye { font: 500 0.75rem var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--cream-3); }
  .now h1 { font: 800 clamp(2rem, 1.5rem + 2.5vw, 2.75rem)/1.02 var(--sans); letter-spacing: -0.035em; margin-top: 6px; }
  .caps { margin-top: 16px; display: grid; gap: 10px; }
  .cap { font-size: 1.1875rem; line-height: 1.5; color: var(--cream-3); padding-left: 14px; border-left: 3px solid transparent; transition: color 0.3s, border-color 0.3s; }
  .cap.cur { color: var(--cream); border-color: var(--amber); }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .btn { min-height: var(--tap); padding: 0 18px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); font-weight: 700; }
  .btn.hot { background: var(--amber); color: #1b1206; border-color: var(--amber); }
  .btn[aria-pressed="true"] { background: rgb(122 217 168 / 0.15); border-color: var(--mint); color: var(--mint); }
  .call { margin-top: 24px; padding: 18px; border-radius: 22px; background: var(--panel); border: 1px solid var(--line); display: grid; gap: 12px; }
  .call h2 { font: 800 1.375rem var(--sans); letter-spacing: -0.02em; }
  .callrow { display: flex; gap: 8px; } .callrow input { flex: 1; min-width: 0; min-height: var(--tap); border-radius: 99px; border: 1px solid var(--line); background: var(--bg-2); padding: 0 16px; outline: none; }
  .callrow input:focus { border-color: var(--amber); }
  .mic { width: var(--tap); height: var(--tap); border-radius: 99px; border: 0; background: var(--red); color: #fff; font-size: 1.1rem; }
  .mic[aria-pressed="true"] { box-shadow: 0 0 0 6px rgb(255 91 61 / 0.3); }
  .list { margin-top: 22px; display: grid; gap: 8px; }
  .list button { display: grid; grid-template-columns: 4.4rem 1fr auto; align-items: center; gap: 12px; min-height: 58px; padding: 0 14px; border-radius: 16px; border: 1px solid var(--line); background: none; text-align: left; }
  .list button[aria-pressed="true"] { border-color: var(--amber); background: var(--amber-soft); }
  .list b { font: 500 1.0625rem var(--mono); color: var(--amber); } .list small { color: var(--cream-3); font-size: 0.875rem; }
  .demo { display: inline-flex; font: 500 0.6875rem var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--cream-3); border: 1px dashed var(--cream-3); padding: 1px 6px; border-radius: 4px; }
  .sheet { position: fixed; z-index: 50; inset: auto 0 0 0; padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); background: var(--panel); border-top: 1px solid var(--line); border-radius: 26px 26px 0 0; transform: translateY(105%); transition: transform 0.3s; }
  .sheet.on { transform: none; } .sheet > div { max-width: 32rem; margin: 0 auto; display: grid; gap: 12px; }
  .sheet input { min-height: var(--tap); border-radius: 14px; border: 1px solid var(--line); background: var(--bg-2); padding: 0 14px; }
  #toast { position: fixed; z-index: 60; left: 50%; top: 16px; translate: -50% -10px; opacity: 0; padding: 10px 16px; border-radius: 99px; background: var(--amber); color: #1b1206; font-weight: 700; transition: 0.25s; pointer-events: none; }
  #toast.on { opacity: 1; translate: -50% 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header><span class="brand"><small>Emissora del poble</small>Ràdio Súria</span><span class="live" id="clock">En directe</span><button class="me" id="me" aria-label="El meu compte">·</button></header>
  <section class="radio" id="radio" aria-label="Sintonitzador">
    <div class="dialwin"><div class="band" id="band"><div class="scale" id="scale"></div></div><span class="needle" aria-hidden="true"></span></div>
    <div class="tune"><button class="knob" id="prev" aria-label="Emissora anterior">◀</button><div class="freq" aria-live="polite"><b id="fq">88.1</b><span id="fname">El dia</span></div><button class="knob" id="next" aria-label="Emissora següent">▶</button></div>
    <div class="player"><button class="play" id="play" aria-label="Escolta">▶</button><div class="wave" aria-hidden="true">${''}</div></div>
  </section>
  <section class="now" aria-live="polite"><p class="eye" id="eye"></p><h1 id="title"></h1><div class="caps" id="caps"></div><div class="acts" id="acts"></div></section>
  <section class="call"><h2>Truca a l’estudi</h2><p style="color:var(--cream-2)">Fes la pregunta parlant o escrivint i te la responem en antena. <span class="demo">Mode demostració</span></p>
    <form class="callrow" id="cf"><label for="cq" style="position:absolute;left:-9999px">Pregunta</label><input id="cq" placeholder="Quan surt el pròxim bus?" autocomplete="off"><button type="button" class="mic" id="mic" aria-pressed="false" aria-label="Parla">●</button><button class="mic" style="background:var(--amber);color:#1b1206" aria-label="Envia">↑</button></form></section>
  <section class="list" id="list" aria-label="Totes les emissores"></section>
  <p style="margin-top:18px;color:var(--cream-3);font-size:.875rem">Tot el contingut és d’exemple. Si el teu navegador no té veu, els subtítols t’ho expliquen tot.</p>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div id="sbody"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// Motor comú dels prototips: dades d'exemple, estat al dispositiu, assistent de demostració i petites utilitats.
// Tot el contingut és D'EXEMPLE (no són dades reals de Súria).
const SURIA = (() => {
  const KEY = 'suria-variant-' + (document.documentElement.dataset.variant || 'x');
  const fresh = () => ({ user: null, going: {}, thanks: {}, buddy: {}, votes: {}, posts: [], text: 'm', chat: [] });
  let st = fresh();
  try { st = { ...fresh(), ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch (e) { /* sense emmagatzematge */ }
  const subs = new Set();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* opcional */ } subs.forEach((f) => f(st)); };
  const state = { get: () => st, set(fn) { fn(st); save(); }, on(f) { subs.add(f); } };

  const DOW = ['diumenge', 'dilluns', 'dimarts', 'dimecres', 'dijous', 'divendres', 'dissabte'];
  const DOWS = ['dg', 'dl', 'dt', 'dc', 'dj', 'dv', 'ds'];
  const MON = ['gener', 'febrer', 'març', 'abril', 'maig', 'juny', 'juliol', 'agost', 'setembre', 'octubre', 'novembre', 'desembre'];
  const day = (n) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + n); return d; };
  const cap = (s) => s[0].toUpperCase() + s.slice(1);
  const dayLabel = (n) => (n === 0 ? 'Avui' : n === 1 ? 'Demà' : `${cap(DOW[day(n).getDay()])} ${day(n).getDate()}`);
  const longDate = (d = new Date()) => `${cap(DOW[d.getDay()])}, ${d.getDate()} ${['març', 'abril', 'agost', 'octubre'].includes(MON[d.getMonth()]) ? 'd’' : 'de '}${MON[d.getMonth()]}`;
  const hhmm = (d = new Date()) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  const greet = () => { const h = new Date().getHours(); return h < 6 ? 'Bona nit' : h < 14 ? 'Bon dia' : h < 20 ? 'Bona tarda' : 'Bon vespre'; };

  const events = [
    { id: 'passeig', d: 0, h: '10:00', end: '11:30', cat: 'Natura', tone: 'mint', t: 'Passeig a ritme lent pel riu', l: 'Pont vell', going: 18, first: true, x: 'El grup espera cinc minuts. El ritme el marca qui va més a poc a poc. A la meitat hi ha bancs.' },
    { id: 'tauletes', d: 0, h: '17:00', end: '18:30', cat: 'Gent gran', tone: 'coral', t: 'Tarda de tauletes i mòbils', l: 'Biblioteca', going: 12, first: true, x: 'Entres, et donen un cafè i et presenten qui t’ajudarà. Pots preguntar el mateix deu vegades.' },
    { id: 'contes', d: 1, h: '17:30', end: '18:15', cat: 'Famílies', tone: 'sky', t: 'Contes amb llanterna', l: 'Biblioteca infantil', going: 29, x: 'Infants a terra amb coixins, famílies al darrere. Uns 40 minuts.' },
    { id: 'cor', d: 1, h: '20:00', end: '21:30', cat: 'Cultura', tone: 'sun', t: 'Assaig obert del cor', l: 'Casal cultural', going: 23, first: true, x: 'Seus al fons. Al descans et pregunten si vols provar. Dir que no també està bé.' },
    { id: 'sopar', d: 3, h: '20:30', end: '22:30', cat: 'Veïnat', tone: 'lilac', t: 'Sopar de benvinguda als nous veïns', l: 'Casal cultural', going: 41, first: true, x: 'Algú t’espera a la porta i et presenta gent. Taules llargues, sense lloc fix.' },
    { id: 'mercat', d: 4, h: '10:00', end: '20:00', cat: 'Mercat', tone: 'sun', t: 'Mercat d’hivern de productors', l: 'Plaça major', going: 134, x: 'Al matí és més tranquil. A la tarda hi ha música.' },
    { id: 'ball', d: 5, h: '17:00', end: '19:30', cat: 'Gent gran', tone: 'coral', t: 'Ball de diumenge', l: 'Casal de la gent gran', going: 52, x: 'Comença amb peces lentes. Hi ha cadires a tot el voltant.' },
    { id: 'reparem', d: 7, h: '10:00', end: '13:00', cat: 'Veïnat', tone: 'lilac', t: 'Reparem junts', l: 'Taller del casal', going: 15, first: true, x: 'T’apuntes a l’entrada i esperes torn amb un cafè.' },
  ];
  const posts = [
    { id: 'p1', a: 'Irene V.', i: 'IV', tone: 'sky', badge: 'Nova veïna', ch: 'Hola, sóc nova', m: 22, t: 'Fa un mes que vivim aquí amb la meva filla de 5 anys. Busquem un parc tranquil per les tardes i, si hi ha altres famílies noves, ens encantaria conèixer-vos.', th: 21, r: [['RM', 'coral', 'Rosa', 'Els divendres som unes quantes famílies al parc del riu cap a les sis.']] },
    { id: 'p2', a: 'Toni R.', i: 'TR', tone: 'coral', ch: 'Avís', m: 70, t: 'Ojo: esta mañana hay obras en la entrada del pueblo y un solo carril. Salid con tiempo.', th: 36, r: [['MF', 'lilac', 'Marta', 'Gràcies! A les 8 ja hi havia cua.']] },
    { id: 'p3', a: 'Associació de veïns', i: 'AV', tone: 'mint', badge: 'Entitat', ch: 'Dono un cop de mà', m: 1500, t: 'Busquem dues persones per acompanyar a comprar, un matí a la setmana, veïnes grans que viuen soles.', th: 48, r: [['IV', 'sky', 'Irene', 'Jo puc els dimecres!']] },
    { id: 'p4', a: 'Montse C.', i: 'MC', tone: 'lilac', ch: 'Perdut i trobat', m: 200, t: 'He trobat unes ulleres de lectura amb funda vermella al banc de la plaça.', th: 14, r: [] },
  ];
  const shops = [
    { id: 'forn', n: 'Forn de l’Alba', k: 'Forn', tone: 'sun', o: [['07:00', '14:00'], ['17:00', '20:00']], offer: 'Dijous: segona barra a meitat de preu' },
    { id: 'cafe', n: 'Cafè de la Plaça', k: 'Bar', tone: 'coral', o: [['07:00', '20:00']], offer: 'Menú del dia: 13,50 €', featured: true },
    { id: 'hort', n: 'L’Hort Verd', k: 'Fruita', tone: 'mint', o: [['08:30', '13:30'], ['17:00', '20:00']], offer: 'Entrega gratis a gent gran' },
    { id: 'taverna', n: 'La Taverna del Pont', k: 'Tapes', tone: 'coral', o: [['12:00', '16:00'], ['19:30', '23:00']], offer: 'Dimecres: tapa + canya, 4 €' },
  ];
  const proposal = { t: 'Més bancs a la pujada del centre', n: 212, goal: 250 };
  const bus = ['06:50', '07:55', '08:40', '09:55', '11:00', '12:05', '13:10', '14:50', '16:25', '17:20', '18:45', '19:45'];
  const nextBus = (k = 3) => bus.filter((b) => b >= hhmm()).slice(0, k);
  const minsTo = (b) => { const [h, m] = b.split(':').map(Number); const n = new Date(); return h * 60 + m - (n.getHours() * 60 + n.getMinutes()); };
  const isOpen = (s) => s.o.some(([a, b]) => hhmm() >= a && hhmm() < b);
  const t24 = (x) => x.replace(':', '.');

  const norm = (s) => s.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
  const has = (q, ...w) => w.some((x) => new RegExp(`(^|[^a-z0-9])${x}`).test(q));
  function answer(raw) {
    const q = norm(raw);
    if (has(q, 'bus', 'autobus', 'manresa')) {
      const n = nextBus();
      return { text: n.length ? `El pròxim bus cap a Manresa surt a les **${t24(n[0])} h** (d’aquí a ${minsTo(n[0])} min).\nDesprés: ${n.slice(1).map(t24).join(', ')} h.\n\nHorari d’exemple del prototip.` : 'Avui ja no surten més busos cap a Manresa. El primer de demà és a les **6.50 h**.', actions: [] };
    }
    if (has(q, 'empadron', 'padro', 'padron')) return { text: '**Empadronar-te** és la porta de tot: metge, escola i ajuts.\n- Porta el DNI o NIE i el contracte de lloguer.\n- Fes-ho en línia o a l’oficina d’atenció ciutadana.\n- Guarda el justificant: te’l demanaran al CAP.', actions: [['Guia pas a pas', '#jo']] };
    if (has(q, 'moble', 'mueble', 'sofa', 'matalas', 'colchon')) return { text: 'Els mobles es recullen **a la porta**, demanant-ho amb una setmana d’antelació. Deixa’ls la nit abans, al costat de la porta.', actions: [] };
    if (has(q, 'farmac', 'guardia')) return { text: 'Farmàcia de guàrdia (dada d’exemple): **Farmàcia de la Plaça**, fins demà a les 9.00 h.\nSi és una urgència, truca al **112**.', actions: [['Truca al 112', 'tel:112']] };
    if (has(q, 'sopar', 'cenar', 'obert', 'abierto', 'menjar', 'comer', 'tapes', 'pa(?![a-z])', 'forn', 'cafe')) {
      const o = shops.filter(isOpen);
      return { text: (o.length ? 'Obert ara, segons el que diuen els mateixos negocis:\n' : 'Ara està tot tancat. Aquests obren aviat:\n') + (o.length ? o : shops).map((s) => `- **${s.n}** · ${s.offer}`).join('\n'), actions: [] };
    }
    if (has(q, 'que fer', 'que faig', 'que hacer', 'agenda', 'cap de setmana', 'fin de semana', 'avui', 'hoy', 'activitat')) {
      return { text: 'Això és el que hi ha aviat:\n' + events.slice(0, 4).map((e) => `- **${e.t}** · ${dayLabel(e.d)}, ${t24(e.h)} h · ${e.l}`).join('\n') + '\n\nA cada activitat t’expliquem què passarà i pots dir que busques companyia.', actions: [['Obre l’agenda', '#agenda']] };
    }
    if (has(q, 'nou', 'nueva', 'nuevo', 'acabo', 'arribat', 'gent', 'amics', 'amigos')) return { text: 'Benvingut! Aquesta setmana hi ha un **sopar de benvinguda** on algú t’esperarà a la porta per presentar-te gent. I tens una guia dels primers 30 dies.', actions: [['Sopar de benvinguda', '#agenda/sopar']] };
    if (has(q, '112', 'emergenc', 'urgenc', 'policia')) return { text: 'En una emergència, truca al **112**: gratuït i 24 hores.', actions: [['Truca al 112', 'tel:112']] };
    return { text: 'Encara no tinc aquesta resposta: funciono en **mode demostració**, sense cap model d’IA connectat, i només responc amb el que hi ha a la plataforma.\n\nPots preguntar-ho a la comunitat: algú del poble ho sabrà.', actions: [['Pregunta-ho a la comunitat', '#comunitat']] };
  }
  async function stream(text, onChunk, signal) {
    const wait = (ms) => new Promise((res, rej) => { const id = setTimeout(res, ms); signal && signal.addEventListener('abort', () => { clearTimeout(id); rej(new Error('abort')); }, { once: true }); });
    await wait(500);
    let out = '';
    for (const w of text.match(/\S+\s*/g) || []) { await wait(14 + Math.random() * 24); out += w; onChunk(out); }
    return out;
  }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const md = (t) => {
    const lines = esc(t).split('\n'); let h = ''; let ul = false;
    for (const l of lines) {
      const f = l.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
