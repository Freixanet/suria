<title>Súria Turó</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Inter+Tight:wght@400..700&display=swap">
<script>document.documentElement.dataset.variant = 'turo';</script>
<style>
  /* Variant D · «Turó»: el poble és la interfície. Escena generativa del turó de façanes amb la llum de l'hora;
     marcadors per a activitats, comerços, serveis i veïns. Un sol aspecte decidit: el cel fa de tema,
     i els panells són sempre de vidre clar amb tinta fosca (colors explícits, independents del tema de l'amfitrió). */
  :root {
    --glass: rgb(255 255 255 / 0.88); --glass-2: rgb(255 255 255 / 0.7); --ink: #14171c; --ink-2: #434a53; --ink-3: #626a74; --line: rgb(20 23 28 / 0.12);
    --sun: #ffc23d; --coral: #ff6b4a; --lilac: #7f6cf2; --mint: #22b07d; --river: #2b63d9;
    --display: 'Unbounded', ui-sans-serif, system-ui, sans-serif; --text: 'Inter Tight', ui-sans-serif, system-ui, sans-serif;
    --tap: 46px; color-scheme: light;
  }
  html, body { height: 100%; }
  html[data-text="l"] { font-size: 112.5%; } html[data-text="xl"] { font-size: 125%; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0e1730; color: var(--ink); font: 1rem/1.45 var(--text); overflow: hidden; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, p { margin: 0; } button, input { font: inherit; color: inherit; } button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--river); outline-offset: 2px; border-radius: 10px; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #pins { position: fixed; inset: 0; pointer-events: none; }
  .pin { position: absolute; translate: -50% -100%; pointer-events: auto; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50% 50% 50% 4px; rotate: -45deg; border: 3px solid #fff; background: var(--c); box-shadow: 0 8px 18px -6px rgb(0 0 0 / 0.5); transition: transform 0.2s, opacity 0.3s; }
  .pin span { rotate: 45deg; font: 700 0.875rem var(--display); color: #14171c; }
  .pin:hover, .pin[aria-pressed="true"] { transform: scale(1.18); }
  .pin.dim { opacity: 0.35; filter: grayscale(0.7); }
  @media (prefers-reduced-motion: no-preference) { .pin.now::after { content: ''; position: absolute; inset: -8px; border-radius: inherit; border: 2px solid var(--c); animation: ping 1.8s ease-out infinite; } @keyframes ping { to { inset: -18px; opacity: 0; } } }
  .ui { position: fixed; z-index: 10; }
  .head { top: calc(10px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); display: grid; gap: 8px; }
  .row1 { display: flex; gap: 8px; align-items: center; }
  .glass { background: var(--glass); backdrop-filter: blur(18px) saturate(1.6); -webkit-backdrop-filter: blur(18px) saturate(1.6); box-shadow: 0 0 0 1px var(--line), 0 18px 40px -20px rgb(0 0 0 / 0.5); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 999px; }
  .brand b { font: 700 1rem var(--display); letter-spacing: -0.02em; }
  @media (max-width: 30rem) { .brand { padding: 8px; } .brand b { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); } .clock { padding: 6px 10px; gap: 6px; } }
  .brand i { width: 30px; height: 30px; border-radius: 50%; background: conic-gradient(from 180deg, var(--coral), var(--sun), var(--mint), var(--river), var(--coral)); }
  .clock { flex: 1; display: flex; align-items: center; gap: 10px; padding: 6px 14px; border-radius: 999px; min-width: 0; }
  .clock output { font: 700 1.05rem var(--display); font-variant-numeric: tabular-nums; min-width: 4.2ch; }
  .clock input { flex: 1; width: 0; min-width: 0; accent-color: var(--ink); height: 32px; }
  .clock button { border: 0; background: var(--ink); color: #fff; border-radius: 99px; min-height: 32px; padding: 0 10px; font-size: 0.8125rem; font-weight: 700; }
  .me { width: var(--tap); height: var(--tap); border-radius: 50%; border: 0; display: grid; place-items: center; font-weight: 700; }
  .layers { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .layers button { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 0; font-weight: 650; font-size: 0.9375rem; }
  .layers button i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px #fff; }
  .layers button[aria-pressed="false"] { opacity: 0.55; }
  .panel { left: 0; right: 0; bottom: 0; max-height: 62dvh; display: flex; flex-direction: column; border-radius: 28px 28px 0 0; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); transition: max-height 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .panel.min { max-height: 11.5rem; }
  @media (min-width: 60rem) { .panel, .panel.min { left: auto; right: 16px; top: 140px; bottom: 16px; width: 25rem; max-height: none; border-radius: 28px; padding: 12px 18px 16px; } }
  .grab { width: 44px; height: 5px; border-radius: 99px; background: rgb(20 23 28 / 0.25); margin: 4px auto 8px; border: 0; padding: 0; display: block; }
  @media (min-width: 60rem) { .grab { display: none; } }
  .pbody { overflow-y: auto; overscroll-behavior: contain; flex: 1; display: grid; gap: 12px; align-content: start; padding-bottom: 6px; }
  .eyebrow { font: 700 0.6875rem var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .title { font: 700 1.5rem/1.1 var(--display); letter-spacing: -0.03em; }
  .demo { display: inline-flex; padding: 1px 7px; border: 1px dashed var(--ink-3); border-radius: 5px; font-size: 0.6875rem; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; }
  .item { display: flex; gap: 12px; align-items: center; width: 100%; padding: 10px; border: 0; border-radius: 16px; background: var(--glass-2); text-align: left; box-shadow: 0 0 0 1px var(--line); }
  .item .dot { width: 38px; height: 38px; flex: none; border-radius: 12px; background: var(--c); display: grid; place-items: center; font: 700 0.875rem var(--display); }
  .item b { display: block; font-weight: 650; line-height: 1.25; } .item small { color: var(--ink-3); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 18px; border-radius: 999px; border: 0; background: var(--ink); color: #fff; font-weight: 700; text-decoration: none; }
  .btn.alt { background: rgb(20 23 28 / 0.07); color: var(--ink); }
  .btn[aria-pressed="true"] { background: #d6f2e5; color: #0e5a3c; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .hero-k { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .hero-k div { padding: 10px; border-radius: 14px; background: var(--glass-2); box-shadow: 0 0 0 1px var(--line); }
  .hero-k b { display: block; font: 700 1.25rem var(--display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .hero-k small { font-size: 0.75rem; color: var(--ink-3); font-weight: 600; }
  .ask { display: flex; gap: 6px; padding: 6px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 1px var(--line); margin-top: 8px; }
  .ask input { flex: 1; min-width: 0; border: 0; outline: none; padding: 0 12px; background: none; min-height: 40px; }
  .ask button { width: 40px; height: 40px; border-radius: 99px; border: 0; background: var(--ink); color: #fff; }
  .msg { padding: 12px 14px; border-radius: 16px; background: var(--glass-2); box-shadow: 0 0 0 1px var(--line); }
  .msg.q { justify-self: end; background: var(--ink); color: #fff; }
  .msg ul { padding-left: 18px; margin: 6px 0 0; display: grid; gap: 4px; } .msg p + p { margin-top: 8px; }
  .sky-label { position: fixed; z-index: 5; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(126px + env(safe-area-inset-top, 0px)); color: #fff; text-shadow: 0 2px 20px rgb(0 0 0 / 0.4); pointer-events: none; }
  .sky-label h1 { font: 700 clamp(1.9rem, 1.2rem + 3.4vw, 3.6rem)/1 var(--display); letter-spacing: -0.04em; }
  .sky-label p { font-weight: 600; opacity: 0.9; margin-top: 6px; }
  .credit { position: fixed; z-index: 4; left: 50%; translate: -50% 0; bottom: 12.5rem; font-size: 0.6875rem; color: rgb(255 255 255 / 0.75); }
  @media (min-width: 60rem) { .credit { bottom: 16px; } }
  #toast { position: fixed; z-index: 60; left: 50%; top: calc(120px + env(safe-area-inset-top, 0px)); translate: -50% -8px; opacity: 0; padding: 10px 16px; border-radius: 99px; background: var(--ink); color: #fff; font-weight: 650; transition: 0.25s; pointer-events: none; }
  #toast.on { opacity: 1; translate: -50% 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<canvas id="scene" aria-hidden="true"></canvas>
<div id="pins" role="group" aria-label="Llocs del poble"></div>
<div class="sky-label" id="skylabel"><h1 id="skyh"></h1><p id="skyp"></p></div>
<div class="ui head">
  <div class="row1">
    <span class="brand glass"><i aria-hidden="true"></i><b>Súria</b></span>
    <label class="clock glass" for="t"><output id="tout" aria-live="polite"></output><input id="t" type="range" min="360" max="1439" step="5" aria-label="Hora del dia"><button type="button" id="now">Ara</button></label>
    <button class="me glass" id="me" aria-label="El meu compte">·</button>

    <button class="glass" data-layer="ev" aria-pressed="true" style="--c:var(--sun)"><i></i>Agenda</button>
    <button class="glass" data-layer="shop" aria-pressed="true" style="--c:var(--coral)"><i></i>Comerç</button>
    <button class="glass" data-layer="srv" aria-pressed="true" style="--c:var(--lilac)"><i></i>Serveis</button>
    <button class="glass" data-layer="post" aria-pressed="true" style="--c:var(--mint)"><i></i>Veïns</button>
  </div>
</div>
<section class="ui panel glass min" id="panel" aria-label="Detall"><button class="grab" id="grab" aria-label="Amplia o redueix el panell"></button><div class="pbody" id="pbody"></div></section>
<p class="credit">Escena generada · contingut d’exemple</p>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// Motor comú dels prototips: dades d'exemple, estat al dispositiu, assistent de demostració i petites utilitats.
// Tot el contingut és D'EXEMPLE (no són dades reals de Súria).
const SURIA = (() => {
  const KEY = 'suria-variant-' + (document.documentElement.dataset.variant || 'x');
  const fresh = () => ({ user: null, going: {}, thanks: {}, buddy: {}, votes: {}, posts: [], text: 'm', chat: [] });
  let st = fresh();
  try { st = { ...fresh(), ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch (e) { /* sense emmagatzematge */ }
  const subs = new Set();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* opcional */ } subs.forEach((f) => f(st)); };
  const state = { get: () => st, set(fn) { fn(st); save(); }, on(f) { subs.add(f); } };

  const DOW = ['diumenge', 'dilluns', 'dimarts', 'dimecres', 'dijous', 'divendres', 'dissabte'];
  const DOWS = ['dg', 'dl', 'dt', 'dc', 'dj', 'dv', 'ds'];
  const MON = ['gener', 'febrer', 'març', 'abril', 'maig', 'juny', 'juliol', 'agost', 'setembre', 'octubre', 'novembre', 'desembre'];
  const day = (n) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + n); return d; };
  const cap = (s) => s[0].toUpperCase() + s.slice(1);
  const dayLabel = (n) => (n === 0 ? 'Avui' : n === 1 ? 'Demà' : `${cap(DOW[day(n).getDay()])} ${day(n).getDate()}`);
  const longDate = (d = new Date()) => `${cap(DOW[d.getDay()])}, ${d.getDate()} ${['març', 'abril', 'agost', 'octubre'].includes(MON[d.getMonth()]) ? 'd’' : 'de '}${MON[d.getMonth()]}`;
  const hhmm = (d = new Date()) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  const greet = () => { const h = new Date().getHours(); return h < 6 ? 'Bona nit' : h < 14 ? 'Bon dia' : h < 20 ? 'Bona tarda' : 'Bon vespre'; };

  const events = [
    { id: 'passeig', d: 0, h: '10:00', end: '11:30', cat: 'Natura', tone: 'mint', t: 'Passeig a ritme lent pel riu', l: 'Pont vell', going: 18, first: true, x: 'El grup espera cinc minuts. El ritme el marca qui va més a poc a poc. A la meitat hi ha bancs.' },
    { id: 'tauletes', d: 0, h: '17:00', end: '18:30', cat: 'Gent gran', tone: 'coral', t: 'Tarda de tauletes i mòbils', l: 'Biblioteca', going: 12, first: true, x: 'Entres, et donen un cafè i et presenten qui t’ajudarà. Pots preguntar el mateix deu vegades.' },
    { id: 'contes', d: 1, h: '17:30', end: '18:15', cat: 'Famílies', tone: 'sky', t: 'Contes amb llanterna', l: 'Biblioteca infantil', going: 29, x: 'Infants a terra amb coixins, famílies al darrere. Uns 40 minuts.' },
    { id: 'cor', d: 1, h: '20:00', end: '21:30', cat: 'Cultura', tone: 'sun', t: 'Assaig obert del cor', l: 'Casal cultural', going: 23, first: true, x: 'Seus al fons. Al descans et pregunten si vols provar. Dir que no també està bé.' },
    { id: 'sopar', d: 3, h: '20:30', end: '22:30', cat: 'Veïnat', tone: 'lilac', t: 'Sopar de benvinguda als nous veïns', l: 'Casal cultural', going: 41, first: true, x: 'Algú t’espera a la porta i et presenta gent. Taules llargues, sense lloc fix.' },
    { id: 'mercat', d: 4, h: '10:00', end: '20:00', cat: 'Mercat', tone: 'sun', t: 'Mercat d’hivern de productors', l: 'Plaça major', going: 134, x: 'Al matí és més tranquil. A la tarda hi ha música.' },
    { id: 'ball', d: 5, h: '17:00', end: '19:30', cat: 'Gent gran', tone: 'coral', t: 'Ball de diumenge', l: 'Casal de la gent gran', going: 52, x: 'Comença amb peces lentes. Hi ha cadires a tot el voltant.' },
    { id: 'reparem', d: 7, h: '10:00', end: '13:00', cat: 'Veïnat', tone: 'lilac', t: 'Reparem junts', l: 'Taller del casal', going: 15, first: true, x: 'T’apuntes a l’entrada i esperes torn amb un cafè.' },
  ];
  const posts = [
    { id: 'p1', a: 'Irene V.', i: 'IV', tone: 'sky', badge: 'Nova veïna', ch: 'Hola, sóc nova', m: 22, t: 'Fa un mes que vivim aquí amb la meva filla de 5 anys. Busquem un parc tranquil per les tardes i, si hi ha altres famílies noves, ens encantaria conèixer-vos.', th: 21, r: [['RM', 'coral', 'Rosa', 'Els divendres som unes quantes famílies al parc del riu cap a les sis.']] },
    { id: 'p2', a: 'Toni R.', i: 'TR', tone: 'coral', ch: 'Avís', m: 70, t: 'Ojo: esta mañana hay obras en la entrada del pueblo y un solo carril. Salid con tiempo.', th: 36, r: [['MF', 'lilac', 'Marta', 'Gràcies! A les 8 ja hi havia cua.']] },
    { id: 'p3', a: 'Associació de veïns', i: 'AV', tone: 'mint', badge: 'Entitat', ch: 'Dono un cop de mà', m: 1500, t: 'Busquem dues persones per acompanyar a comprar, un matí a la setmana, veïnes grans que viuen soles.', th: 48, r: [['IV', 'sky', 'Irene', 'Jo puc els dimecres!']] },
    { id: 'p4', a: 'Montse C.', i: 'MC', tone: 'lilac', ch: 'Perdut i trobat', m: 200, t: 'He trobat unes ulleres de lectura amb funda vermella al banc de la plaça.', th: 14, r: [] },
  ];
  const shops = [
    { id: 'forn', n: 'Forn de l’Alba', k: 'Forn', tone: 'sun', o: [['07:00', '14:00'], ['17:00', '20:00']], offer: 'Dijous: segona barra a meitat de preu' },
    { id: 'cafe', n: 'Cafè de la Plaça', k: 'Bar', tone: 'coral', o: [['07:00', '20:00']], offer: 'Menú del dia: 13,50 €', featured: true },
    { id: 'hort', n: 'L’Hort Verd', k: 'Fruita', tone: 'mint', o: [['08:30', '13:30'], ['17:00', '20:00']], offer: 'Entrega gratis a gent gran' },
    { id: 'taverna', n: 'La Taverna del Pont', k: 'Tapes', tone: 'coral', o: [['12:00', '16:00'], ['19:30', '23:00']], offer: 'Dimecres: tapa + canya, 4 €' },
  ];
  const proposal = { t: 'Més bancs a la pujada del centre', n: 212, goal: 250 };
  const bus = ['06:50', '07:55', '08:40', '09:55', '11:00', '12:05', '13:10', '14:50', '16:25', '17:20', '18:45', '19:45'];
  const nextBus = (k = 3) => bus.filter((b) => b >= hhmm()).slice(0, k);
  const minsTo = (b) => { const [h, m] = b.split(':').map(Number); const n = new Date(); return h * 60 + m - (n.getHours() * 60 + n.getMinutes()); };
  const isOpen = (s) => s.o.some(([a, b]) => hhmm() >= a && hhmm() < b);
  const t24 = (x) => x.replace(':', '.');

  const norm = (s) => s.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
  const has = (q, ...w) => w.some((x) => new RegExp(`(^|[^a-z0-9])${x}`).test(q));
  function answer(raw) {
    const q = norm(raw);
    if (has(q, 'bus', 'autobus', 'manresa')) {
      const n = nextBus();
      return { text: n.length ? `El pròxim bus cap a Manresa surt a les **${t24(n[0])} h** (d’aquí a ${minsTo(n[0])} min).\nDesprés: ${n.slice(1).map(t24).join(', ')} h.\n\nHorari d’exemple del prototip.` : 'Avui ja no surten més busos cap a Manresa. El primer de demà és a les **6.50 h**.', actions: [] };
    }
    if (has(q, 'empadron', 'padro', 'padron')) return { text: '**Empadronar-te** és la porta de tot: metge, escola i ajuts.\n- Porta el DNI o NIE i el contracte de lloguer.\n- Fes-ho en línia o a l’oficina d’atenció ciutadana.\n- Guarda el justificant: te’l demanaran al CAP.', actions: [['Guia pas a pas', '#jo']] };
    if (has(q, 'moble', 'mueble', 'sofa', 'matalas', 'colchon')) return { text: 'Els mobles es recullen **a la porta**, demanant-ho amb una setmana d’antelació. Deixa’ls la nit abans, al costat de la porta.', actions: [] };
    if (has(q, 'farmac', 'guardia')) return { text: 'Farmàcia de guàrdia (dada d’exemple): **Farmàcia de la Plaça**, fins demà a les 9.00 h.\nSi és una urgència, truca al **112**.', actions: [['Truca al 112', 'tel:112']] };
    if (has(q, 'sopar', 'cenar', 'obert', 'abierto', 'menjar', 'comer', 'tapes', 'pa(?![a-z])', 'forn', 'cafe')) {
      const o = shops.filter(isOpen);
      return { text: (o.length ? 'Obert ara, segons el que diuen els mateixos negocis:\n' : 'Ara està tot tancat. Aquests obren aviat:\n') + (o.length ? o : shops).map((s) => `- **${s.n}** · ${s.offer}`).join('\n'), actions: [] };
    }
    if (has(q, 'que fer', 'que faig', 'que hacer', 'agenda', 'cap de setmana', 'fin de semana', 'avui', 'hoy', 'activitat')) {
      return { text: 'Això és el que hi ha aviat:\n' + events.slice(0, 4).map((e) => `- **${e.t}** · ${dayLabel(e.d)}, ${t24(e.h)} h · ${e.l}`).join('\n') + '\n\nA cada activitat t’expliquem què passarà i pots dir que busques companyia.', actions: [['Obre l’agenda', '#agenda']] };
    }
    if (has(q, 'nou', 'nueva', 'nuevo', 'acabo', 'arribat', 'gent', 'amics', 'amigos')) return { text: 'Benvingut! Aquesta setmana hi ha un **sopar de benvinguda** on algú t’esperarà a la porta per presentar-te gent. I tens una guia dels primers 30 dies.', actions: [['Sopar de benvinguda', '#agenda/sopar']] };
    if (has(q, '112', 'emergenc', 'urgenc', 'policia')) return { text: 'En una emergència, truca al **112**: gratuït i 24 hores.', actions: [['Truca al 112', 'tel:112']] };
    return { text: 'Encara no tinc aquesta resposta: funciono en **mode demostració**, sense cap model d’IA connectat, i només responc amb el que hi ha a la plataforma.\n\nPots preguntar-ho a la comunitat: algú del poble ho sabrà.', actions: [['Pregunta-ho a la comunitat', '#comunitat']] };
  }
  async function stream(text, onChunk, signal) {
    const wait = (ms) => new Promise((res, rej) => { const id = setTimeout(res, ms); signal && signal.addEventListener('abort', () => { clearTimeout(id); rej(new Error('abort')); }, { once: true }); });
    await wait(500);
    let out = '';
    for (const w of text.match(/\S+\s*/g) || []) { await wait(14 + Math.random() * 24); out += w; onChunk(out); }
    return out;
  }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const md = (t) => {
    const lines = esc(t).split('\n'); let h = ''; let ul = false;
    for (const l of lines) {
      const f = l.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      if (l.startsWith('- ')) { if (!ul) { h += '<ul>'; ul = true; } h += `<li>${f.slice(2)}</li>`; }
      else { if (ul) { h += '</ul>'; ul = false; } if (l.trim()) h += `<p>${f}</p>`; }
    }
    return h + (ul ? '</ul>' : '');
  };
  let tt;
