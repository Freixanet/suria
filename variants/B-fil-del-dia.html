<style>
  /* Variant B · «Fil del dia»: una cosa cada vegada, lletra gran, veu primer. Columna única de lectura, també a l'escriptori. */
  :root {
    --bg: #ffffff; --ink: #0b1a12; --ink-2: #2c3b33; --ink-3: #4b5a52; --line: #d9e2dc; --soft: #f1f5f2;

  :root[data-theme="dark"] {
    --bg: #0b120e; --ink: #eef5f0; --ink-2: #c6d3cb; --ink-3: #9fb0a6; --line: #26342c; --soft: #142019;
    --go: #8fe0b0; --go-ink: #06140c; --sun: #4a3c08; --sun-ink: #ffe27a; --coral: #3b1d14; --coral-ink: #ffb79f; --sky: #0f2a40; --sky-ink: #a9d6ff; --mint: #12301f; --mint-ink: #9ee6bb; color-scheme: dark; }
  html { font-size: 112.5%; } html[data-text="m"] { font-size: 100%; } html[data-text="xl"] { font-size: 131%; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 1.0625rem/1.55 var(--text); }
  h1, h2, h3, p { margin: 0; } ul { margin: 0; padding: 0; list-style: none; }
  button, input, textarea { font: inherit; color: inherit; } button { cursor: pointer; }
  :focus-visible { outline: 4px solid var(--go); outline-offset: 3px; border-radius: 10px; }
  .col { max-width: 44rem; margin-inline: auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-bottom: calc(7rem + env(safe-area-inset-bottom, 0px)); }
  .d { font-family: var(--display); font-variation-settings: 'wdth' 85; letter-spacing: -0.02em; }
  .demo { display: inline-block; padding: 1px 8px; border: 1.5px dashed var(--ink-3); border-radius: 6px; font-size: 0.75rem; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; vertical-align: middle; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 6px; }
  .mark { display: flex; align-items: center; gap: 10px; font: 800 1.35rem var(--display); }
  .mark i { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 50% 38%, var(--sun) 0 34%, var(--go) 35%); }
  .me { min-width: var(--tap); height: var(--tap); padding: 0 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--bg); font-weight: 700; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: var(--tap); padding: 0 22px; border-radius: 18px; border: 0; background: var(--go); color: var(--go-ink); font-weight: 750; font-size: 1.0625rem; text-decoration: none; }
  .btn.alt { background: var(--soft); color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
  .btn.wide { width: 100%; }
  .btn[aria-pressed="true"] { background: var(--mint); color: var(--mint-ink); box-shadow: inset 0 0 0 2px var(--go); }
  .hello { padding-block: 8px 18px; }

  .duo { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 16px; }

  .thing { position: relative; display: grid; gap: 6px; padding: 22px; border-radius: 26px; background: var(--c, var(--soft)); color: var(--ci, var(--ink)); margin-top: 12px; }

  .thing .big { font: 800 clamp(3.5rem, 2.5rem + 6vw, 5rem)/0.9 var(--display); font-variation-settings: 'wdth' 78; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; color: var(--ink); }
  .thing .mid { font: 750 clamp(1.6rem, 1.3rem + 1.5vw, 2rem)/1.1 var(--display); color: var(--ink); }

  .t-sun { --c: var(--sun); --ci: var(--sun-ink); } .t-coral { --c: var(--coral); --ci: var(--coral-ink); } .t-sky { --c: var(--sky); --ci: var(--sky-ink); } .t-mint { --c: var(--mint); --ci: var(--mint-ink); }

  .days button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .ev { padding: 20px; border-radius: 24px; border: 2px solid var(--line); margin-top: 12px; display: grid; gap: 6px; }

  .mic { width: 9rem; height: 9rem; border-radius: 50%; border: 0; background: var(--go); color: var(--go-ink); display: grid; place-items: center; box-shadow: 0 0 0 10px var(--mint); margin: 14px 0 4px; }
  .mic svg { width: 56px; height: 56px; }
  .mic[aria-pressed="true"] { background: #c0352b; color: #fff; box-shadow: 0 0 0 10px var(--coral); }
  @media (prefers-reduced-motion: no-preference) { .mic[aria-pressed="true"] { animation: pulse 1.2s ease-in-out infinite; } @keyframes pulse { 50% { box-shadow: 0 0 0 18px var(--coral); } } }
  .typed { display: flex; gap: 8px; width: 100%; margin-top: 10px; }
  .typed input { flex: 1; min-width: 0; min-height: var(--tap); padding: 0 18px; border-radius: 18px; border: 2px solid var(--line); background: var(--bg); outline: none; }
  .typed input:focus { border-color: var(--go); }
  .quick { display: grid; gap: 8px; width: 100%; margin-top: 8px; }
  .quick button { min-height: var(--tap); text-align: left; padding: 10px 18px; border-radius: 18px; border: 2px solid var(--line); background: var(--bg); font-weight: 650; }
  .msg { margin-top: 18px; padding: 20px; border-radius: 24px; background: var(--soft); }
  .msg.q { background: var(--ink); color: var(--bg); font-weight: 650; }
  .msg ul { list-style: disc; padding-left: 22px; display: grid; gap: 6px; } .msg p + p, .msg p + ul, .msg ul + p { margin-top: 10px; }
  .msg .act { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  /* Pas a pas */
  .story { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: none; flex-direction: column; padding: calc(14px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); }
  .story.on { display: flex; }
  .segs { display: flex; gap: 6px; max-width: 44rem; width: 100%; margin: 0 auto; }
  .segs span { flex: 1; height: 6px; border-radius: 99px; background: var(--line); } .segs span.done { background: var(--ink); }
  .story .card { flex: 1; max-width: 44rem; width: 100%; margin: 16px auto; border-radius: 32px; padding: 28px; display: flex; flex-direction: column; justify-content: center; gap: 14px; background: var(--c); color: var(--ci); }
  .story .card .big { font: 800 clamp(4rem, 3rem + 8vw, 7rem)/0.9 var(--display); font-variation-settings: 'wdth' 76; color: var(--ink); letter-spacing: -0.04em; }
  .story .card .mid { font: 800 clamp(2rem, 1.5rem + 3vw, 3rem)/1.05 var(--display); color: var(--ink); }
  .story .nav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; max-width: 44rem; width: 100%; margin: 0 auto; }
  .post { padding: 20px; border-radius: 24px; border: 2px solid var(--line); margin-top: 12px; display: grid; gap: 10px; }
  .post .who { font-weight: 800; } .post .who small { font-weight: 600; color: var(--ink-3); }
  .post p.t { font-size: 1.125rem; }
  .sheet { position: fixed; inset: auto 0 0 0; z-index: 70; padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); background: var(--bg); border-top: 2px solid var(--line); border-radius: 28px 28px 0 0; box-shadow: 0 -20px 50px rgb(0 0 0 / 0.25); transform: translateY(105%); transition: transform 0.3s; }
  .sheet.on { transform: none; } .sheet > div { max-width: 40rem; margin: 0 auto; display: grid; gap: 12px; }
  .sheet input, .sheet textarea { min-height: var(--tap); padding: 12px 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--bg); width: 100%; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg button { min-height: 4rem; border-radius: 16px; border: 2px solid var(--line); background: var(--bg); font-weight: 800; }
  .seg button[aria-pressed="true"] { border-color: var(--go); background: var(--mint); color: var(--mint-ink); }
  #toast { position: fixed; z-index: 80; left: 50%; bottom: calc(6.5rem + env(safe-area-inset-bottom, 0px)); translate: -50% 20px; opacity: 0; padding: 14px 20px; border-radius: 18px; background: var(--ink); color: var(--bg); font-weight: 700; transition: 0.25s; pointer-events: none; max-width: calc(100% - 32px); }
  #toast.on { opacity: 1; translate: -50% 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>
// Motor comú dels prototips: dades d'exemple, estat al dispositiu, assistent de demostració i petites utilitats.
// Tot el contingut és D'EXEMPLE (no són dades reals de Súria).
const SURIA = (() => {
  const KEY = 'suria-variant-' + (document.documentElement.dataset.variant || 'x');
  const fresh = () => ({ user: null, going: {}, thanks: {}, buddy: {}, votes: {}, posts: [], text: 'm', chat: [] });
  let st = fresh();
  try { st = { ...fresh(), ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch (e) { /* sense emmagatzematge */ }
  const subs = new Set();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* opcional */ } subs.forEach((f) => f(st)); };
  const state = { get: () => st, set(fn) { fn(st); save(); }, on(f) { subs.add(f); } };

  const DOW = ['diumenge', 'dilluns', 'dimarts', 'dimecres', 'dijous', 'divendres', 'dissabte'];
  const DOWS = ['dg', 'dl', 'dt', 'dc', 'dj', 'dv', 'ds'];
  const MON = ['gener', 'febrer', 'març', 'abril', 'maig', 'juny', 'juliol', 'agost', 'setembre', 'octubre', 'novembre', 'desembre'];
  const day = (n) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + n); return d; };
  const cap = (s) => s[0].toUpperCase() + s.slice(1);
  const dayLabel = (n) => (n === 0 ? 'Avui' : n === 1 ? 'Demà' : `${cap(DOW[day(n).getDay()])} ${day(n).getDate()}`);
  const longDate = (d = new Date()) => `${cap(DOW[d.getDay()])}, ${d.getDate()} ${['març', 'abril', 'agost', 'octubre'].includes(MON[d.getMonth()]) ? 'd’' : 'de '}${MON[d.getMonth()]}`;
  const hhmm = (d = new Date()) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  const greet = () => { const h = new Date().getHours(); return h < 6 ? 'Bona nit' : h < 14 ? 'Bon dia' : h < 20 ? 'Bona tarda' : 'Bon vespre'; };

  const events = [
    { id: 'passeig', d: 0, h: '10:00', end: '11:30', cat: 'Natura', tone: 'mint', t: 'Passeig a ritme lent pel riu', l: 'Pont vell', going: 18, first: true, x: 'El grup espera cinc minuts. El ritme el marca qui va més a poc a poc. A la meitat hi ha bancs.' },
    { id: 'tauletes', d: 0, h: '17:00', end: '18:30', cat: 'Gent gran', tone: 'coral', t: 'Tarda de tauletes i mòbils', l: 'Biblioteca', going: 12, first: true, x: 'Entres, et donen un cafè i et presenten qui t’ajudarà. Pots preguntar el mateix deu vegades.' },
    { id: 'contes', d: 1, h: '17:30', end: '18:15', cat: 'Famílies', tone: 'sky', t: 'Contes amb llanterna', l: 'Biblioteca infantil', going: 29, x: 'Infants a terra amb coixins, famílies al darrere. Uns 40 minuts.' },
    { id: 'cor', d: 1, h: '20:00', end: '21:30', cat: 'Cultura', tone: 'sun', t: 'Assaig obert del cor', l: 'Casal cultural', going: 23, first: true, x: 'Seus al fons. Al descans et pregunten si vols provar. Dir que no també està bé.' },
    { id: 'sopar', d: 3, h: '20:30', end: '22:30', cat: 'Veïnat', tone: 'lilac', t: 'Sopar de benvinguda als nous veïns', l: 'Casal cultural', going: 41, first: true, x: 'Algú t’espera a la porta i et presenta gent. Taules llargues, sense lloc fix.' },
    { id: 'mercat', d: 4, h: '10:00', end: '20:00', cat: 'Mercat', tone: 'sun', t: 'Mercat d’hivern de productors', l: 'Plaça major', going: 134, x: 'Al matí és més tranquil. A la tarda hi ha música.' },
    { id: 'ball', d: 5, h: '17:00', end: '19:30', cat: 'Gent gran', tone: 'coral', t: 'Ball de diumenge', l: 'Casal de la gent gran', going: 52, x: 'Comença amb peces lentes. Hi ha cadires a tot el voltant.' },
    { id: 'reparem', d: 7, h: '10:00', end: '13:00', cat: 'Veïnat', tone: 'lilac', t: 'Reparem junts', l: 'Taller del casal', going: 15, first: true, x: 'T’apuntes a l’entrada i esperes torn amb un cafè.' },
  ];
  const posts = [
    { id: 'p1', a: 'Irene V.', i: 'IV', tone: 'sky', badge: 'Nova veïna', ch: 'Hola, sóc nova', m: 22, t: 'Fa un mes que vivim aquí amb la meva filla de 5 anys. Busquem un parc tranquil per les tardes i, si hi ha altres famílies noves, ens encantaria conèixer-vos.', th: 21, r: [['RM', 'coral', 'Rosa', 'Els divendres som unes quantes famílies al parc del riu cap a les sis.']] },
    { id: 'p2', a: 'Toni R.', i: 'TR', tone: 'coral', ch: 'Avís', m: 70, t: 'Ojo: esta mañana hay obras en la entrada del pueblo y un solo carril. Salid con tiempo.', th: 36, r: [['MF', 'lilac', 'Marta', 'Gràcies! A les 8 ja hi havia cua.']] },
    { id: 'p3', a: 'Associació de veïns', i: 'AV', tone: 'mint', badge: 'Entitat', ch: 'Dono un cop de mà', m: 1500, t: 'Busquem dues persones per acompanyar a comprar, un matí a la setmana, veïnes grans que viuen soles.', th: 48, r: [['IV', 'sky', 'Irene', 'Jo puc els dimecres!']] },
    { id: 'p4', a: 'Montse C.', i: 'MC', tone: 'lilac', ch: 'Perdut i trobat', m: 200, t: 'He trobat unes ulleres de lectura amb funda vermella al banc de la plaça.', th: 14, r: [] },
  ];
  const shops = [
    { id: 'forn', n: 'Forn de l’Alba', k: 'Forn', tone: 'sun', o: [['07:00', '14:00'], ['17:00', '20:00']], offer: 'Dijous: segona barra a meitat de preu' },
    { id: 'cafe', n: 'Cafè de la Plaça', k: 'Bar', tone: 'coral', o: [['07:00', '20:00']], offer: 'Menú del dia: 13,50 €', featured: true },
    { id: 'hort', n: 'L’Hort Verd', k: 'Fruita', tone: 'mint', o: [['08:30', '13:30'], ['17:00', '20:00']], offer: 'Entrega gratis a gent gran' },
    { id: 'taverna', n: 'La Taverna del Pont', k: 'Tapes', tone: 'coral', o: [['12:00', '16:00'], ['19:30', '23:00']], offer: 'Dimecres: tapa + canya, 4 €' },
  ];
  const proposal = { t: 'Més bancs a la pujada del centre', n: 212, goal: 250 };
  const bus = ['06:50', '07:55', '08:40', '09:55', '11:00', '12:05', '13:10', '14:50', '16:25', '17:20', '18:45', '19:45'];
  const nextBus = (k = 3) => bus.filter((b) => b >= hhmm()).slice(0, k);
  const minsTo = (b) => { const [h, m] = b.split(':').map(Number); const n = new Date(); return h * 60 + m - (n.getHours() * 60 + n.getMinutes()); };
  const isOpen = (s) => s.o.some(([a, b]) => hhmm() >= a && hhmm() < b);
  const t24 = (x) => x.replace(':', '.');

  const norm = (s) => s.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
  const has = (q, ...w) => w.some((x) => new RegExp(`(^|[^a-z0-9])${x}`).test(q));
  function answer(raw) {
    const q = norm(raw);
    if (has(q, 'bus', 'autobus', 'manresa')) {
      const n = nextBus();
      return { text: n.length ? `El pròxim bus cap a Manresa surt a les **${t24(n[0])} h** (d’aquí a ${minsTo(n[0])} min).\nDesprés: ${n.slice(1).map(t24).join(', ')} h.\n\nHorari d’exemple del prototip.` : 'Avui ja no surten més busos cap a Manresa. El primer de demà és a les **6.50 h**.', actions: [] };
    }
    if (has(q, 'empadron', 'padro', 'padron')) return { text: '**Empadronar-te** és la porta de tot: metge, escola i ajuts.\n- Porta el DNI o NIE i el contracte de lloguer.\n- Fes-ho en línia o a l’oficina d’atenció ciutadana.\n- Guarda el justificant: te’l demanaran al CAP.', actions: [['Guia pas a pas', '#jo']] };
    if (has(q, 'moble', 'mueble', 'sofa', 'matalas', 'colchon')) return { text: 'Els mobles es recullen **a la porta**, demanant-ho amb una setmana d’antelació. Deixa’ls la nit abans, al costat de la porta.', actions: [] };
    if (has(q, 'farmac', 'guardia')) return { text: 'Farmàcia de guàrdia (dada d’exemple): **Farmàcia de la Plaça**, fins demà a les 9.00 h.\nSi és una urgència, truca al **112**.', actions: [['Truca al 112', 'tel:112']] };
    if (has(q, 'sopar', 'cenar', 'obert', 'abierto', 'menjar', 'comer', 'tapes', 'pa(?![a-z])', 'forn', 'cafe')) {
      const o = shops.filter(isOpen);
      return { text: (o.length ? 'Obert ara, segons el que diuen els mateixos negocis:\n' : 'Ara està tot tancat. Aquests obren aviat:\n') + (o.length ? o : shops).map((s) => `- **${s.n}** · ${s.offer}`).join('\n'), actions: [] };
    }
    if (has(q, 'que fer', 'que faig', 'que hacer', 'agenda', 'cap de setmana', 'fin de semana', 'avui', 'hoy', 'activitat')) {
      return { text: 'Això és el que hi ha aviat:\n' + events.slice(0, 4).map((e) => `- **${e.t}** · ${dayLabel(e.d)}, ${t24(e.h)} h · ${e.l}`).join('\n') + '\n\nA cada activitat t’expliquem què passarà i pots dir que busques companyia.', actions: [['Obre l’agenda', '#agenda']] };
    }
    if (has(q, 'nou', 'nueva', 'nuevo', 'acabo', 'arribat', 'gent', 'amics', 'amigos')) return { text: 'Benvingut! Aquesta setmana hi ha un **sopar de benvinguda** on algú t’esperarà a la porta per presentar-te gent. I tens una guia dels primers 30 dies.', actions: [['Sopar de benvinguda', '#agenda/sopar']] };
    if (has(q, '112', 'emergenc', 'urgenc', 'policia')) return { text: 'En una emergència, truca al **112**: gratuït i 24 hores.', actions: [['Truca al 112', 'tel:112']] };
    return { text: 'Encara no tinc aquesta resposta: funciono en **mode demostració**, sense cap model d’IA connectat, i només responc amb el que hi ha a la plataforma.\n\nPots preguntar-ho a la comunitat: algú del poble ho sabrà.', actions: [['Pregunta-ho a la comunitat', '#comunitat']] };
  }
  async function stream(text, onChunk, signal) {
    const wait = (ms) => new Promise((res, rej) => { const id = setTimeout(res, ms); signal && signal.addEventListener('abort', () => { clearTimeout(id); rej(new Error('abort')); }, { once: true }); });
    await wait(500);
    let out = '';
    for (const w of text.match(/\S+\s*/g) || []) { await wait(14 + Math.random() * 24); out += w; onChunk(out); }
    return out;
  }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const md = (t) => {
    const lines = esc(t).split('\n'); let h = ''; let ul = false;
    for (const l of lines) {
      const f = l.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      if (l.startsWith('- ')) { if (!ul) { h += '<ul>'; ul = true; } h += `<li>${f.slice(2)}</li>`; }
      else { if (ul) { h += '</ul>'; ul = false; } if (l.trim()) h += `<p>${f}</p>`; }
    }
    return h + (ul ? '</ul>' : '');
  };
  let tt;
  const toast = (m) => { const el = document.getElementById('toast'); if (!el) return; el.textContent = m; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2400); };
  const initials = (n) => { const p = n.trim().split(/\s+/); return ((p[0] || '')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); };
  const ago = (m) => (m < 60 ? `fa ${m} min` : m < 1440 ? `fa ${Math.round(m / 60)} h` : m < 2880 ? 'ahir' : `fa ${Math.round(m / 1440)} dies`);
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  return { state, events, posts, shops, proposal, nextBus, minsTo, isOpen, t24, dayLabel, longDate, greet, answer, stream, md, esc, toast, initials, ago, day, DOWS, reduced, hhmm };
})();

const S = SURIA, $ = (q) => document.querySelector(q), view = $('#view');
if (!S.state.get().textSet) S.state.set((s) => { s.text = 'l'; s.textSet = 1; });
const applyText = () => { const t = S.state.get().text; if (t === 'l') delete document.documentElement.dataset.text; else document.documentElement.dataset.text = t; };
applyText();

function speak(text) {
  if (!('speechSynthesis' in window)) { S.toast('Aquest navegador no pot llegir en veu alta'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\*\*/g, ''));
  u.lang = 'ca-ES'; u.rate = 0.92;
  const v = speechSynthesis.getVoices().find((x) => x.lang.startsWith('ca')) || speechSynthesis.getVoices().find((x) => x.lang.startsWith('es'));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

function things() {

    { cls: 't-coral', k: 'Farmàcia de guàrdia', mid: 'Farmàcia de la Plaça', p: 'Oberta fins demà a les 9 del matí.', say: 'La farmàcia de guàrdia és la Farmàcia de la Plaça, fins demà a les nou.' },
    { cls: 't-sun', k: 'Avui al poble', mid: e.t, p: `${S.t24(e.h)} h · ${e.l}. ${e.going} persones hi van.`, ev: e, say: `Avui al poble: ${e.t}, a les ${S.t24(e.h)}, a ${e.l}.` },
    { cls: 't-mint', k: 'Aquesta nit, treu…', mid: 'Orgànica i resta', p: 'A partir de les 8 del vespre.', say: 'Aquesta nit cal treure l’orgànica i la resta, a partir de les vuit.' },
    { cls: '', k: 'Del veïnat', mid: `${p.a.split(' ')[0]} pregunta`, p: p.t, say: `Del veïnat: ${p.t}` },

}
const goBtn = (e) => { const on = !!S.state.get().going[e.id]; return `<button class="btn ${on ? '' : ''}" data-go="${e.id}" aria-pressed="${on}">${on ? '✓ Hi vaig' : 'Hi vull anar'}</button>`; };

function avui() {
  const u = S.state.get().user, ts = things();
  return `<section class="hello"><p>${S.longDate()}</p><h1>${S.greet()}${u ? `, ${S.esc(u.n.split(' ')[0])}` : ''}.</h1>

    ${ts.map((t) => `<article class="thing ${t.cls}"><div class="k">${t.k}<button class="btn alt" style="min-height:44px;padding:0 14px;border-radius:14px" data-say="${S.esc(t.say)}" aria-label="Escolta: ${t.k}">🔊</button></div>${t.big ? `<span class="big">${t.big}</span>` : `<span class="mid">${S.esc(t.mid)}</span>`}<p>${S.esc(t.p)}</p>${t.ev ? `<div class="act">${goBtn(t.ev)}<a class="btn alt" href="#agenda">Veure l’agenda</a></div>` : ''}</article>`).join('')}
    <h2 class="sec">Nou al poble?</h2><article class="thing t-sky"><span class="mid">Sopar de benvinguda</span><p>Divendres a les 20.30 al Casal. Algú t’esperarà a la porta per presentar-te gent.</p><div class="act">${goBtn(S.events.find((x) => x.id === 'sopar'))}</div></article>`;
}
let dayF = 0;
function agenda() {
  const days = [0, 1, 3, 4, 5, 7];
  const l = S.events.filter((e) => e.d === dayF);
  return `<section class="hello"><h1 style="font-size:clamp(2.6rem,2rem + 4vw,3.5rem)">Agenda</h1><p style="margin-top:6px">Tria un dia. <span class="demo">Exemple</span></p></section>
    <div class="days" role="group" aria-label="Dia">${days.map((d) => `<button data-day="${d}" aria-pressed="${d === dayF}">${S.dayLabel(d).split(' ')[0]}<br><span style="font-weight:600;font-size:.9rem">${S.day(d).getDate()}</span></button>`).join('')}</div>
    ${l.map((e) => `<article class="ev"><span class="when">${S.t24(e.h)} h</span><h3>${e.t}</h3><p>${e.l} · ${e.going + (S.state.get().going[e.id] ? 1 : 0)} hi van</p>${e.first ? `<p class="first">Primera vegada? ${e.x}</p>` : ''}<div class="act">${goBtn(e)}<button class="btn alt" data-buddy="${e.id}" aria-pressed="${!!S.state.get().buddy[e.id]}">${S.state.get().buddy[e.id] ? '✓ Amb companyia' : 'Vull companyia'}</button></div></article>`).join('')}`;
}
let rec = null;
function pregunta() {
  const msgs = S.state.get().chat.slice(-6);
  return `<section class="askhead"><h1>Pregunta-ho<br>com ho diries</h1><p style="color:var(--ink-2)">Prem el botó i parla. També pots escriure.</p>
    <button class="mic" id="mic" aria-pressed="false" aria-label="Prem i parla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
    <span class="demo">Mode demostració · sense model d’IA</span>
    <form class="typed" id="tf"><label for="tq" style="position:absolute;left:-9999px">Escriu la pregunta</label><input id="tq" placeholder="O escriu-la aquí…" autocomplete="off"><button class="btn" aria-label="Envia">Envia</button></form>
    ${msgs.length ? '' : `<div class="quick">${['Quan surt el bus?', 'Quina farmàcia és de guàrdia?', 'Què hi ha avui al poble?', 'Com m’empadrono?'].map((q) => `<button data-q="${q}">${q}</button>`).join('')}</div>`}</section>
    <div id="log" role="log" aria-live="polite">${msgs.map(bub).join('')}</div>`;
}
const bub = (m) => (m.r === 'me' ? `<div class="msg q">${S.esc(m.t)}</div>` : `<div class="msg">${S.md(m.t)}<div class="act"><button class="btn alt" data-say="${S.esc(m.t)}">🔊 Escolta-ho</button>${(m.a || []).map(([l, h]) => `<a class="btn" href="${h}">${l}</a>`).join('')}</div></div>`);
async function ask(q) {
  q = q.trim(); if (!q) return;
  const log = $('#log'); document.querySelector('.quick')?.remove();
  log.insertAdjacentHTML('beforeend', bub({ r: 'me', t: q }));
  const a = S.answer(q), el = document.createElement('div'); el.className = 'msg'; el.textContent = 'Pensant…'; log.append(el);
  el.scrollIntoView({ block: 'center' });
  await S.stream(a.text, (t) => { el.innerHTML = S.md(t); });
  el.outerHTML = bub({ r: 'ai', t: a.text, a: a.actions });
  S.state.set((s) => { s.chat.push({ r: 'me', t: q }, { r: 'ai', t: a.text, a: a.actions }); s.chat = s.chat.slice(-20); });
}
function veins() {
  const mine = S.state.get().posts.map((p) => ({ a: S.state.get().user?.n || 'Tu', badge: 'ara mateix', t: p.t, id: p.id, th: 0 }));
  return `<section class="hello"><h1 style="font-size:clamp(2.6rem,2rem + 4vw,3.5rem)">Veïns</h1><p style="margin-top:6px">Avisos, preguntes i ajuda. <span class="demo">Exemple</span></p></section>
    <button class="btn wide" id="compose">✏️ Escriu al poble</button>
    ${[...mine.reverse(), ...S.posts].map((p) => `<article class="post"><p class="who">${S.esc(p.a)} <small>· ${p.badge || S.ago(p.m)}</small></p><p class="t">${S.esc(p.t)}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn alt" data-thx="${p.id}" aria-pressed="${!!S.state.get().thanks[p.id]}">♥ Gràcies</button><button class="btn alt" data-say="${S.esc(p.t)}">🔊</button></div></article>`).join('')}`;
}
function sheet(html) { $('#sheet').innerHTML = `<div>${html}<button class="btn alt wide" id="closesheet">Tanca</button></div>`; $('#sheet').classList.add('on'); setTimeout(() => $('#sheet').querySelector('input,textarea,button')?.focus(), 60); }
const closeSheet = () => $('#sheet').classList.remove('on');
function needUser() {
  if (S.state.get().user) return false;
  sheet(`<h2 class="d" style="font-size:2rem">Com et diuen?</h2><p style="color:var(--ink-2)">Només el nom. Així els veïns saben qui hi va.</p><form id="si" style="display:grid;gap:10px"><label for="nm" style="font-weight:700">Nom i cognom</label><input id="nm" autocomplete="name" placeholder="Marta Puig"><button class="btn wide">Entra</button></form>`);
  $('#si').onsubmit = (e) => { e.preventDefault(); const n = $('#nm').value.trim(); if (n.length < 2) return; S.state.set((s) => { s.user = { n, i: S.initials(n) }; }); closeSheet(); S.toast(`Hola, ${n.split(' ')[0]}!`); render(); };
  return true;
}
function account() {
  const s = S.state.get();
  sheet(`<h2 class="d" style="font-size:2rem">${s.user ? S.esc(s.user.n) : 'El meu compte'}</h2>
    <p style="font-weight:700">Mida de la lletra</p><div class="seg">${[['m', 'A'], ['l', 'A+'], ['xl', 'A++']].map(([k, l], i) => `<button data-size="${k}" aria-pressed="${s.text === k}" style="font-size:${1 + i * 0.25}rem">${l}</button>`).join('')}</div>
    ${s.user ? '<button class="btn alt wide" id="logout">Surt</button>' : '<button class="btn wide" id="login">Entra</button>'}`);
}
let step = 0;
function story(i) {
  const ts = things(); step = Math.max(0, Math.min(ts.length - 1, i)); const t = ts[step];
  $('#story').innerHTML = `<div class="segs" aria-hidden="true">${ts.map((_, k) => `<span class="${k <= step ? 'done' : ''}"></span>`).join('')}</div>
    <div class="card ${t.cls}" style="${t.cls ? '' : '--c:var(--soft);--ci:var(--ink)'}"><p style="font-weight:800">${step + 1} de ${ts.length} · ${t.k}</p>${t.big ? `<span class="big">${t.big}</span>` : `<span class="mid">${S.esc(t.mid)}</span>`}<p style="font-size:1.25rem;color:var(--ink)">${S.esc(t.p)}</p><button class="btn alt" data-say="${S.esc(t.say)}" style="align-self:flex-start">🔊 Escolta-ho</button></div>
    <div class="nav"><button class="btn alt" id="sb" ${step === 0 ? 'disabled' : ''}>Enrere</button><button class="btn" id="sn">${step === ts.length - 1 ? 'Ja està' : 'Següent'}</button></div>`;
  $('#story').classList.add('on'); $('#sn').focus();
}
function render() {
  const r = (location.hash.slice(1) || 'avui').split('/')[0];
  view.innerHTML = ({ avui, agenda, pregunta, veins }[r] || avui)();
  document.querySelectorAll('[data-nav]').forEach((a) => (a.dataset.nav === r ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
  $('#mebtn').textContent = S.state.get().user ? S.state.get().user.i : 'Jo';
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.say) { speak(b.dataset.say); return; }
  if (b.id === 'readday') { speak(`${S.greet()}. Avui és ${S.longDate()}. ` + things().map((t) => t.say).join(' ')); return; }
  if (b.id === 'stepbtn') { story(0); return; }
  if (b.id === 'sn') { if (step >= things().length - 1) { $('#story').classList.remove('on'); speechSynthesis?.cancel(); } else story(step + 1); return; }
  if (b.id === 'sb') { story(step - 1); return; }
  if (b.dataset.go) { if (needUser()) return; const id = b.dataset.go; S.state.set((s) => { s.going[id] ? delete s.going[id] : (s.going[id] = 1); }); S.toast(S.state.get().going[id] ? 'Apuntat. T’ho recordarem el dia abans.' : 'Ja no hi vas.'); render(); return; }
  if (b.dataset.buddy) { if (needUser()) return; const id = b.dataset.buddy; S.state.set((s) => { s.buddy[id] ? delete s.buddy[id] : (s.buddy[id] = 1); }); S.toast('Et presentarem algú que també hi va.'); render(); return; }
  if (b.dataset.thx) { if (needUser()) return; const id = b.dataset.thx; S.state.set((s) => { s.thanks[id] ? delete s.thanks[id] : (s.thanks[id] = 1); }); render(); return; }
  if (b.dataset.day) { dayF = Number(b.dataset.day); render(); return; }
  if (b.dataset.q) { ask(b.dataset.q); return; }
  if (b.dataset.size) { S.state.set((s) => { s.text = b.dataset.size; }); applyText(); account(); return; }
  if (b.id === 'mebtn') { account(); return; }
  if (b.id === 'closesheet') { closeSheet(); return; }
  if (b.id === 'login') { closeSheet(); setTimeout(needUser, 50); return; }
  if (b.id === 'logout') { S.state.set((s) => { s.user = null; }); closeSheet(); render(); return; }
  if (b.id === 'compose') { if (needUser()) return; sheet(`<h2 class="d" style="font-size:2rem">Escriu al poble</h2><form id="pf" style="display:grid;gap:10px"><label for="pt" style="font-weight:700">Missatge</label><textarea id="pt" rows="4" placeholder="Com si parlessis amb un veí."></textarea><button class="btn wide">Publica</button></form>`); $('#pf').onsubmit = (ev) => { ev.preventDefault(); const t = $('#pt').value.trim(); if (t.length < 3) return; S.state.set((s) => { s.posts.push({ id: 'm' + Date.now(), t }); }); closeSheet(); S.toast('Publicat. Gràcies!'); render(); }; return; }
  if (b.id === 'mic') {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { S.toast('Aquest navegador no pot escoltar. Escriu la pregunta a sota.'); $('#tq').focus(); return; }
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = 'ca-ES'; rec.interimResults = false; b.setAttribute('aria-pressed', 'true');
    rec.onresult = (ev) => ask(ev.results[0][0].transcript);
    rec.onend = rec.onerror = () => { rec = null; b.setAttribute('aria-pressed', 'false'); };
    rec.start();
  }
});
document.addEventListener('submit', (e) => { if (e.target.id === 'tf') { e.preventDefault(); const v = $('#tq').value; $('#tq').value = ''; ask(v); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeSheet(); $('#story').classList.remove('on'); } if ($('#story').classList.contains('on')) { if (e.key === 'ArrowRight') story(step + 1); if (e.key === 'ArrowLeft') story(step - 1); } });
window.addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
render();
