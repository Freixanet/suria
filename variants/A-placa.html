<script>
// Motor comú dels prototips: dades d'exemple, estat al dispositiu, assistent de demostració i petites utilitats.
// Tot el contingut és D'EXEMPLE (no són dades reals de Súria).
const SURIA = (() => {
  const KEY = 'suria-variant-' + (document.documentElement.dataset.variant || 'x');
  const fresh = () => ({ user: null, going: {}, thanks: {}, buddy: {}, votes: {}, posts: [], text: 'm', chat: [] });
  let st = fresh();
  try { st = { ...fresh(), ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch (e) { /* sense emmagatzematge */ }
  const subs = new Set();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* opcional */ } subs.forEach((f) => f(st)); };
  const state = { get: () => st, set(fn) { fn(st); save(); }, on(f) { subs.add(f); } };

  const DOW = ['diumenge', 'dilluns', 'dimarts', 'dimecres', 'dijous', 'divendres', 'dissabte'];
  const DOWS = ['dg', 'dl', 'dt', 'dc', 'dj', 'dv', 'ds'];
  const MON = ['gener', 'febrer', 'març', 'abril', 'maig', 'juny', 'juliol', 'agost', 'setembre', 'octubre', 'novembre', 'desembre'];

    <p class="muted" style="margin-top:10px">Llegir-ho tot és lliure. Amb compte pots apuntar-te, donar les gràcies i publicar. Sense contrasenyes.</p>
    <form id="si"><div class="field"><label for="nm">Nom i cognom</label><input class="input" id="nm" autocomplete="name" placeholder="Marta Puig"></div>
    <div class="field"><label for="em">Correu</label><input class="input" id="em" type="email" placeholder="nom@correu.cat"></div>
    <button class="btn acc" style="width:100%;margin-top:16px">Entra</button></form>
    <p class="muted" style="font-size:.8125rem;margin-top:10px">Prototip: res surt del teu dispositiu.</p>`);
  $('#si').onsubmit = (e) => { e.preventDefault(); const n = $('#nm').value.trim(); if (n.length < 2) { $('#nm').focus(); return; } S.state.set((s) => { s.user = { n, i: S.initials(n) }; }); closeSheet(); S.toast(`Benvingut/da, ${n.split(' ')[0]}!`); render(); };
  return true;
}
const goingBtn = (e) => { const on = !!S.state.get().going[e.id]; return `<button class="btn sm ${on ? '' : 'acc'}" data-go="${e.id}" aria-pressed="${on}">${on ? '✓ Hi vas' : '+ Hi vaig'}</button>`; };
const evCard = (e) => `<article class="ev" data-tone="${e.tone}"><div class="d"><small>${S.dayLabel(e.d)}</small><b>${S.t24(e.h)}</b></div>
  <div><span class="tag">${e.cat}</span>${e.first ? ' <span class="tag" data-tone="sky">1a vegada</span>' : ''}<h3 style="margin-top:6px"><a href="#agenda/${e.id}" style="text-decoration:none">${e.t}</a></h3><p class="meta">${e.l}</p>
  <div class="row"><span class="muted" style="font-size:.875rem"><b style="color:var(--ink)">${e.going + (S.state.get().going[e.id] ? 1 : 0)}</b> hi van</span>${goingBtn(e)}</div></div></article>`;
const postCard = (p) => { const th = !!S.state.get().thanks[p.id]; return `<article class="post"><div class="who"><span class="av" data-tone="${p.tone}">${p.i}</span><span><b>${S.esc(p.a)}</b><small>${p.badge ? p.badge + ' · ' : ''}${p.m === 0 ? 'ara mateix' : S.ago(p.m)}</small></span><span class="tag" data-tone="${p.tone}" style="margin-left:auto">${p.ch}</span></div>
  <p>${S.esc(p.t)}</p>${(p.r || []).map((r) => `<div class="reply"><span class="av" data-tone="${r[1]}" style="width:1.75rem;height:1.75rem;font-size:.7rem">${r[0]}</span><p><b>${r[2]}</b> ${S.esc(r[3])}</p></div>`).join('')}
  <div><button class="btn sm soft" data-thx="${p.id}" aria-pressed="${th}">♥ Gràcies ${p.th + (th ? 1 : 0)}</button></div></article>`; };

function home() {
  const u = S.state.get().user, b = S.nextBus(), first = S.events.filter((e) => e.d <= 1).length;
  return `<section class="hero"><img src="${FOTO}" alt="Vista de Súria: cases esglaonades al turó amb el campanar al capdamunt."><span class="credit">Foto: Krzysztof Golik · CC BY-SA 4.0</span>
    <div class="wrap"><p class="eyebrow">${S.longDate()}</p><h1>${S.greet()}${u ? `, <em>${S.esc(u.n.split(' ')[0])}</em>` : ''}.</h1>
    <p class="line">${b[0] ? `El pròxim bus a Manresa surt a les ${S.t24(b[0])} h. Avui hi ha ${first} activitats al poble.` : `Avui hi ha ${first} activitats al poble.`}</p></div></section>
  <div class="wrap sheetup">
    <form class="ask" id="askf" role="search"><span aria-hidden="true" style="color:var(--accent)">✦</span><label class="sr" for="askq" style="position:absolute;left:-9999px">Pregunta</label><input id="askq" placeholder="Pregunta el que vulguis sobre Súria…" autocomplete="off"><button aria-label="Pregunta">↑</button></form>
    <div class="chips">${['Quan surt el pròxim bus?', 'Com m’empadrono?', 'Què faig aquest cap de setmana?', 'On puc sopar avui?'].map((q) => `<button class="chip" data-q="${q}">${q}</button>`).join('')}</div>
    <section class="sec"><div class="sec-h"><h2>Ara mateix</h2><span class="demo">Exemple</span></div><div class="now">
      <div class="w big" data-tone="sky"><div class="k"><span>Bus cap a Manresa</span></div>${b[0] ? `<span class="v">${S.t24(b[0])}<small style="font-size:.4em"> h</small></span><span class="s">d’aquí a ${S.minsTo(b[0])} min · després ${b.slice(1).map(S.t24).join(', ')}</span>` : '<span class="m">Avui ja no en surten més</span>'}</div>
      <div class="w" data-tone="coral"><div class="k"><span>Farmàcia de guàrdia</span></div><span class="m">Farmàcia de la Plaça</span><span class="s">Fins demà, 9.00 h</span></div>
      <div class="w" data-tone="mint"><div class="k"><span>Aquesta nit</span></div><span class="m">Orgànica i resta</span><span class="s">Treu-ho a partir de les 20 h</span></div>
    </div></section>
    <section class="sec"><div class="sec-h"><h2>Avui i aquests dies</h2><a href="#agenda">Tota l’agenda →</a></div><div class="evs">${S.events.slice(0, 4).map(evCard).join('')}</div></section>
    <section class="sec"><div class="sec-h"><h2>Al poble se’n parla</h2><a href="#comunitat">Comunitat →</a></div><div class="grid2">${S.posts.slice(0, 2).map(postCard).join('')}</div></section>
    <section class="sec"><div class="sec-h"><h2>Compra al poble</h2><span class="demo">Exemple</span></div><div class="grid2">${S.shops.map((s) => `<article class="shop" data-tone="${s.tone}"><span class="open" style="${S.isOpen(s) ? '' : 'color:var(--ink-3)'}">${S.isOpen(s) ? '● Obert ara' : 'Tancat ara'}${s.featured ? ' · Destacat' : ''}</span><h3>${s.n}</h3><p class="muted" style="font-size:.9375rem">${s.k} · ${s.offer}</p></article>`).join('')}</div></section>
    <section class="sec"><div class="prop"><p class="eyebrow">La veu del poble</p><h3 style="font:400 1.75rem/1.1 var(--serif)">${S.proposal.t}</h3><div class="bar-p"><span style="width:${S.proposal.n / S.proposal.goal * 100}%"></span></div><p class="muted" style="font-size:.9375rem"><b style="color:var(--ink)">${S.proposal.n + (S.state.get().votes.prop ? 1 : 0)}</b> de ${S.proposal.goal} suports per portar-la a l’Ajuntament</p><div><button class="btn sm ${S.state.get().votes.prop ? '' : 'acc'}" data-vote="prop" aria-pressed="${!!S.state.get().votes.prop}">${S.state.get().votes.prop ? '✓ Hi dones suport' : 'Dona-hi suport'}</button></div></div></section>
    <p class="muted" style="font-size:.8125rem;margin-top:2rem">Prototip independent. Tot el contingut, excepte la foto, és d’exemple.</p>
  </div>`;
}
function agenda(id) {
  const e = S.events.find((x) => x.id === id);
  if (e) setTimeout(() => { openSheet(`<span class="tag" data-tone="${e.tone}">${e.cat}</span><h2 id="sheet-t" style="margin-top:10px">${e.t}</h2><p style="margin-top:10px;font-weight:600">${S.dayLabel(e.d)} · ${S.t24(e.h)}–${S.t24(e.end)} h · ${e.l}</p>
    <div class="card" style="margin-top:14px;background:var(--cel)"><p style="font-weight:650;color:var(--cel-i)">Primera vegada? Això és el que passarà</p><p style="margin-top:6px">${e.x}</p></div>
    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">${goingBtn(e)}<button class="btn sm soft" data-buddy="${e.id}" aria-pressed="${!!S.state.get().buddy[e.id]}">${S.state.get().buddy[e.id] ? '✓ Buscant companyia' : 'Busco companyia'}</button><button class="btn sm soft" onclick="closeSheet();location.hash='#agenda'">Tanca</button></div>`); }, 0);
  return `<div class="wrap"><header class="ph"><p class="eyebrow">Què passa al poble</p><h1>Agenda <em>de veïns</em></h1><p class="muted" style="margin-top:8px">Apunta’t amb un toc. A cada activitat t’expliquem què passarà. <span class="demo">Exemple</span></p></header>
    ${[0, 1, 3, 4, 5, 7].map((d) => { const l = S.events.filter((x) => x.d === d); return l.length ? `<section class="sec" style="margin-top:1.5rem"><h2 style="font:400 2rem/1 var(--serif);margin-bottom:12px">${S.dayLabel(d)}</h2><div class="evs">${l.map(evCard).join('')}</div></section>` : ''; }).join('')}</div>`;
}
let ctrl = null;
function pregunta() {
  const msgs = S.state.get().chat;
  return `<div class="wrap"><div class="chat">${msgs.length ? `<div class="log" id="log" role="log" aria-live="polite">${msgs.map(bubble).join('')}</div>` : `<div class="empty"><div class="orb" aria-hidden="true">✦</div><h1>Què vols saber <em>de Súria?</em></h1><p class="muted" style="max-width:34ch">Pregunta com ho faries a un veí. Et diré d’on trec la resposta.</p><span class="demo">Mode demostració · sense model d’IA</span><div class="sug">${['Quan surt el pròxim bus a Manresa?', 'Com m’empadrono?', 'Què faig aquest cap de setmana?', 'On puc sopar avui?', 'On llenço un matalàs vell?', 'Acabo d’arribar. Per on començo?'].map((q) => `<button data-q="${q}">${q}</button>`).join('')}</div></div><div class="log" id="log" role="log" aria-live="polite"></div>`}
    <div class="dock"><form class="comp" id="cf"><button type="button" class="ico" aria-label="Adjunta" onclick="S.toast('Els adjunts arribaran amb el model connectat')">＋</button><label for="cq" style="position:absolute;left:-9999px">Pregunta</label><textarea id="cq" rows="1" placeholder="Pregunta el que vulguis sobre Súria…"></textarea><button type="button" class="ico" aria-label="Dicta" id="mic">🎙</button><button class="ico send" aria-label="Envia">↑</button></form><p class="note">Pot equivocar-se. Comprova les dades importants a la font oficial.</p></div></div></div>`;
}
const bubble = (m) => (m.r === 'me' ? `<div class="me">${S.esc(m.t)}</div>` : `<div class="ai"><p class="by">✦ Súria</p>${S.md(m.t)}${m.a && m.a.length ? `<div class="acts">${m.a.map(([l, h]) => `<a class="btn sm soft" href="${h}">${l} →</a>`).join('')}</div>` : ''}</div>`);
async function ask(q) {
  q = q.trim(); if (!q) return;
  if (location.hash !== '#pregunta') { sessionAsk = q; location.hash = '#pregunta'; return; }
  document.querySelector('.empty')?.remove();
  const log = $('#log'); log.insertAdjacentHTML('beforeend', bubble({ r: 'me', t: q }));
  const a = S.answer(q); const el = document.createElement('div'); el.className = 'ai'; el.innerHTML = '<p class="by">✦ Súria</p><p class="muted">Pensant…</p>'; log.append(el);
  ctrl = new AbortController(); el.scrollIntoView({ block: 'end', behavior: S.reduced() ? 'auto' : 'smooth' });
  try { await S.stream(a.text, (t) => { el.innerHTML = '<p class="by">✦ Súria</p>' + S.md(t); }, ctrl.signal); } catch (e) { /* aturat */ }
  el.outerHTML = bubble({ r: 'ai', t: a.text, a: a.actions });
  S.state.set((s) => { s.chat.push({ r: 'me', t: q }, { r: 'ai', t: a.text, a: a.actions }); s.chat = s.chat.slice(-30); });
}
let sessionAsk = null;
function comunitat() {
  const mine = S.state.get().posts.map((p) => ({ ...p, a: S.state.get().user?.n || 'Tu', i: S.state.get().user?.i || 'TU', tone: 'coral', ch: 'Pregunta', m: 0, th: 0, r: [] }));
  return `<div class="wrap"><header class="ph"><p class="eyebrow">El poble, connectat</p><h1>Entre <em>veïns</em></h1><p class="muted" style="margin-top:8px">Amb nom real, amb respecte i revisat per gent del poble. <span class="demo">Exemple</span></p></header>
    <button class="card" id="compose" style="width:100%;text-align:left;border:0;display:flex;gap:10px;align-items:center;color:var(--ink-3)"><span class="av" data-tone="coral">${S.state.get().user?.i || '·'}</span>Què vols compartir amb el poble?<span class="btn sm acc" style="margin-left:auto">Publica</span></button>
    <div class="card" style="margin-top:12px;background:var(--ink);color:var(--paper);box-shadow:none"><p class="eyebrow" style="color:#f4c46a">Pregunta de la setmana</p><p style="font:400 1.75rem/1.1 var(--serif);margin-top:6px">Quin racó del poble ensenyaries a algú que acaba d’arribar?</p><p style="margin-top:8px;opacity:.8;font-size:.9375rem">58 veïns han respost</p></div>
    <div style="display:grid;gap:10px;margin-top:12px">${[...mine.reverse(), ...S.posts].map(postCard).join('')}</div></div>`;
}
function jo() {
  const s = S.state.get();
  return `<div class="wrap" style="max-width:40rem"><header class="ph"><p class="eyebrow">El teu racó</p><h1>${s.user ? S.esc(s.user.n) : 'Entra a <em>Súria</em>'}</h1></header>
    ${s.user ? `<div class="grid2"><div class="card"><p class="eyebrow">Activitats</p><p style="font:400 2.5rem/1 var(--serif)">${Object.keys(s.going).length}</p></div><div class="card"><p class="eyebrow">Gràcies donades</p><p style="font:400 2.5rem/1 var(--serif)">${Object.keys(s.thanks).length}</p></div></div>` : '<button class="btn acc" id="login" style="width:100%">Entra o crea un compte</button>'}
    <section class="sec"><h2 style="font:400 1.75rem/1 var(--serif);margin-bottom:12px">Llegir còmode</h2><div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span><b>Mida del text</b><br><span class="muted" style="font-size:.875rem">A tota l’app</span></span><div class="seg">${[['m', 'Normal'], ['l', 'Gran'], ['xl', 'Molt gran']].map(([k, l]) => `<button data-size="${k}" aria-pressed="${s.text === k}">${l}</button>`).join('')}</div></div></section>
    ${s.user ? '<button class="btn soft" id="logout" style="width:100%;margin-top:2rem">Surt</button>' : ''}</div>`;
}

function render() {
  const [r, id] = (location.hash.slice(1) || 'inici').split('/');
  const routes = { inici: home, agenda: () => agenda(id), pregunta, comunitat, jo };
  view.innerHTML = (routes[r] || home)();
  document.querySelectorAll('[data-nav]').forEach((a) => { if (a.dataset.nav === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (r === 'pregunta') { const log = $('#log'); log && log.lastElementChild && log.lastElementChild.scrollIntoView({ block: 'end' }); if (sessionAsk) { const q = sessionAsk; sessionAsk = null; ask(q); } }
}
document.documentElement.dataset.text = S.state.get().text;
view.addEventListener('click', (e) => {
  const b = e.target.closest('button, a'); if (!b) return;
  if (b.dataset.q) { ask(b.dataset.q); return; }
  if (b.dataset.go) { if (needUser()) return; const id = b.dataset.go; S.state.set((s) => { s.going[id] ? delete s.going[id] : (s.going[id] = 1); }); S.toast(S.state.get().going[id] ? 'Apuntat! Te’n recordarem el dia abans.' : 'Ja no hi vas.'); render(); return; }
  if (b.dataset.thx) { if (needUser()) return; const id = b.dataset.thx; S.state.set((s) => { s.thanks[id] ? delete s.thanks[id] : (s.thanks[id] = 1); }); render(); return; }
  if (b.dataset.vote) { if (needUser()) return; S.state.set((s) => { s.votes.prop = !s.votes.prop; }); S.toast('Gràcies pel teu suport'); render(); return; }
  if (b.dataset.size) { S.state.set((s) => { s.text = b.dataset.size; }); document.documentElement.dataset.text = b.dataset.size; render(); return; }
  if (b.id === 'login') { needUser(); return; }
  if (b.id === 'logout') { S.state.set((s) => { s.user = null; }); render(); return; }
  if (b.id === 'compose') { if (needUser()) return; openSheet(`<h2 id="sheet-t">Nova publicació</h2><form id="pf"><div class="field"><label for="pt">Missatge</label><textarea class="input" id="pt" rows="4" style="padding:12px 16px" placeholder="Escriu com si parlessis amb un veí."></textarea></div><button class="btn acc" style="width:100%;margin-top:14px">Publica</button></form>`); $('#pf').onsubmit = (ev) => { ev.preventDefault(); const t = $('#pt').value.trim(); if (t.length < 3) return; S.state.set((s) => { s.posts.push({ id: 'm' + Date.now(), t }); }); closeSheet(); S.toast('Publicat. Gràcies per participar!'); render(); }; return; }
  if (b.id === 'mic') { S.toast('El dictat per veu funcionarà al mòbil'); }
});
$('#sheet').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.go) { if (needUser()) return; const id = b.dataset.go; S.state.set((s) => { s.going[id] ? delete s.going[id] : (s.going[id] = 1); }); S.toast(S.state.get().going[id] ? 'Apuntat!' : 'Ja no hi vas.'); closeSheet(); render(); }
  if (b.dataset.buddy) { if (needUser()) return; const id = b.dataset.buddy; S.state.set((s) => { s.buddy[id] ? delete s.buddy[id] : (s.buddy[id] = 1); }); S.toast('Et presentarem algú que també hi va.'); closeSheet(); } });
view.addEventListener('submit', (e) => {
  if (e.target.id === 'askf') { e.preventDefault(); ask($('#askq').value); }
  if (e.target.id === 'cf') { e.preventDefault(); const v = $('#cq').value; $('#cq').value = ''; ask(v); }
});
view.addEventListener('keydown', (e) => { if (e.target.id === 'cq' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#cf').requestSubmit(); } });
window.addEventListener('hashchange', () => { closeSheet(); render(); window.scrollTo(0, 0); });
render();
</script>
