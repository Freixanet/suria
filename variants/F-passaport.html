<style>
  /* Variant F · «Passaport»: plans d'un en un (sí o no), segells per participar i comprar al poble, i gent per anar-hi junts.
     Estil d'adhesiu: vores de tinta, ombres dures i colors plans. */
  :root {
    --bg: #f6f5ef; --card: #ffffff; --ink: #111111; --ink-2: #3a3a3a; --ink-3: #5b5b5b; --sh: #111111;
    --tomato: #ff5a36; --lemon: #ffe14d; --sky: #8fd3ff; --mint: #8ef0c0; --lilac: #c9b8ff;
    --display: 'Gabarito', ui-sans-serif, system-ui, sans-serif; --text: 'Inter', ui-sans-serif, system-ui, sans-serif; --tap: 48px; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121212; --card: #1d1d1d; --ink: #f4f4ef; --ink-2: #cfcfca; --ink-3: #a3a39e; --sh: #f4f4ef; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #121212; --card: #1d1d1d; --ink: #f4f4ef; --ink-2: #cfcfca; --ink-3: #a3a39e; --sh: #f4f4ef; color-scheme: dark; }
  html[data-text="l"] { font-size: 112.5%; } html[data-text="xl"] { font-size: 125%; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 1rem/1.5 var(--text); }
  h1, h2, h3, p { margin: 0; } button, input { font: inherit; color: inherit; } button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--tomato); outline-offset: 3px; border-radius: 12px; }
  .wrap { max-width: 34rem; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(7.5rem + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .stk { border: 2.5px solid var(--ink); box-shadow: 5px 5px 0 var(--sh); border-radius: 22px; background: var(--card); }
  .on-color { color: #111; }
  header { display: flex; align-items: center; justify-content: space-between; padding-block: 18px 12px; }
  .logo { font: 900 1.75rem var(--display); letter-spacing: -0.03em; }
  .logo span { display: inline-block; background: var(--lemon); color: #111; padding: 0 8px; border: 2.5px solid var(--ink); border-radius: 10px; transform: rotate(-3deg); }
  .count { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; font: 800 1rem var(--display); background: var(--mint); color: #111; }
  .count.stk { border-radius: 99px; box-shadow: 3px 3px 0 var(--sh); }
  h1.big { font: 900 clamp(2.2rem, 1.6rem + 3vw, 3rem)/0.95 var(--display); letter-spacing: -0.03em; margin-top: 4px; }
  .sub { color: var(--ink-2); margin-top: 6px; }
  .deck { position: relative; height: 26rem; margin-top: 18px; touch-action: pan-y; }
  .pc { position: absolute; inset: 0; padding: 22px; display: flex; flex-direction: column; gap: 10px; color: #111; background: var(--c); transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s; user-select: none; }
  .pc[data-depth="1"] { transform: translate(8px, 10px) rotate(2deg); }
  .pc[data-depth="2"] { transform: translate(16px, 20px) rotate(4deg); }
  .pc .kind { align-self: flex-start; font: 800 0.8125rem var(--display); text-transform: uppercase; letter-spacing: 0.06em; background: #fff; border: 2px solid #111; border-radius: 99px; padding: 3px 10px; }
  .pc h2 { font: 900 clamp(1.9rem, 1.5rem + 2vw, 2.4rem)/1 var(--display); letter-spacing: -0.03em; }
  .pc .when { font: 800 1.25rem var(--display); }
  .pc p { font-size: 1rem; }
  .pc .x { margin-top: auto; padding: 12px; border: 2px solid #111; border-radius: 14px; background: rgb(255 255 255 / 0.65); font-size: 0.9375rem; }
  .stamp-hint { position: absolute; top: 20px; right: 18px; font: 900 1.4rem var(--display); padding: 4px 10px; border: 3px solid; border-radius: 10px; transform: rotate(12deg); opacity: 0; }
  .yes { color: #0a7a46; } .no { color: #c0352b; left: 18px; right: auto; transform: rotate(-12deg); }
  .decide { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; margin-top: 26px; }
  .decide button { min-height: 60px; font: 900 1.125rem var(--display); }
  .decide .n { background: var(--card); color: var(--ink); } .decide .s { width: 60px; background: var(--lemon); color: #111; } .decide .y { background: var(--tomato); color: #111; }
  .empty { text-align: center; padding: 3rem 1rem; display: grid; gap: 12px; justify-items: center; }
  .btn { min-height: var(--tap); padding: 0 20px; font: 800 1rem var(--display); background: var(--lemon); color: #111; }
  .btn.alt { background: var(--card); color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; }
  .seal { aspect-ratio: 1; border-radius: 50%; border: 2.5px dashed var(--ink-3); display: grid; place-items: center; text-align: center; font: 800 0.6875rem/1.1 var(--display); color: var(--ink-3); padding: 6px; }
  .seal.got { border: 2.5px solid var(--ink); background: var(--c); color: #111; box-shadow: 3px 3px 0 var(--sh); transform: rotate(var(--r)); }
  .seal.got b { display: block; font-size: 1.4rem; }
  .reward { margin-top: 20px; padding: 18px; display: grid; gap: 8px; background: var(--sky); color: #111; }
  .bar { height: 16px; border: 2.5px solid #111; border-radius: 99px; background: #fff; overflow: hidden; } .bar span { display: block; height: 100%; background: var(--tomato); }
  .tiny { font-size: 0.8125rem; color: var(--ink-3); }
  .person { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 16px; margin-top: 14px; }
  .face { width: 58px; height: 58px; border-radius: 50%; border: 2.5px solid var(--ink); display: grid; place-items: center; font: 900 1.25rem var(--display); background: var(--c); color: #111; }
  .person b { font: 800 1.125rem var(--display); display: block; }
  .person .acts { grid-column: 1 / -1; display: flex; gap: 8px; }
  .post { padding: 16px; margin-top: 14px; display: grid; gap: 8px; }
  .msg { padding: 14px 16px; margin-top: 12px; }
  .msg.q { background: var(--lemon); color: #111; margin-left: 15%; }
  .msg ul { padding-left: 20px; margin: 6px 0 0; } .msg p + p { margin-top: 8px; }
  .ask { display: flex; gap: 8px; margin-top: 16px; } .ask input { flex: 1; min-width: 0; min-height: var(--tap); padding: 0 14px; border: 2.5px solid var(--ink); border-radius: 14px; background: var(--card); outline: none; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; } .chips button { min-height: 40px; padding: 0 14px; font: 700 0.9375rem var(--display); background: var(--card); color: var(--ink); border-radius: 99px; box-shadow: 3px 3px 0 var(--sh); }
  nav.tabs { position: fixed; z-index: 30; left: 50%; translate: -50% 0; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(calc(100% - 24px), 30rem); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; gap: 4px; border-radius: 22px; }
  nav.tabs button { min-height: 54px; border: 0; border-radius: 16px; background: none; font: 800 0.875rem var(--display); color: var(--ink); display: grid; place-items: center; gap: 0; }
  nav.tabs button span { font-size: 1.25rem; line-height: 1; }
  nav.tabs button[aria-current="page"] { background: var(--ink); color: var(--bg); }
  .demo { display: inline-block; font: 700 0.6875rem var(--text); letter-spacing: 0.06em; text-transform: uppercase; border: 1.5px dashed var(--ink-3); color: var(--ink-3); padding: 1px 7px; border-radius: 6px; }
  .sheet { position: fixed; z-index: 50; inset: auto 0 0 0; padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); background: var(--card); border-top: 2.5px solid var(--ink); border-radius: 26px 26px 0 0; transform: translateY(105%); transition: transform 0.3s; }
  .sheet.on { transform: none; } .sheet > div { max-width: 32rem; margin: 0 auto; display: grid; gap: 12px; }
  .sheet input { min-height: var(--tap); padding: 0 14px; border: 2.5px solid var(--ink); border-radius: 14px; background: var(--bg); }
  #toast { position: fixed; z-index: 60; left: 50%; top: 16px; translate: -50% -10px; opacity: 0; padding: 10px 16px; border: 2.5px solid #111; border-radius: 99px; background: var(--mint); color: #111; font: 800 0.9375rem var(--display); box-shadow: 3px 3px 0 #111; transition: 0.25s; pointer-events: none; }
  #toast.on { opacity: 1; translate: -50% 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
// Motor comú dels prototips: dades d'exemple, estat al dispositiu, assistent de demostració i petites utilitats.
// Tot el contingut és D'EXEMPLE (no són dades reals de Súria).
const SURIA = (() => {
  const KEY = 'suria-variant-' + (document.documentElement.dataset.variant || 'x');
  const fresh = () => ({ user: null, going: {}, thanks: {}, buddy: {}, votes: {}, posts: [], text: 'm', chat: [] });
  let st = fresh();
  try { st = { ...fresh(), ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch (e) { /* sense emmagatzematge */ }
  const subs = new Set();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* opcional */ } subs.forEach((f) => f(st)); };
  const state = { get: () => st, set(fn) { fn(st); save(); }, on(f) { subs.add(f); } };

  const DOW = ['diumenge', 'dilluns', 'dimarts', 'dimecres', 'dijous', 'divendres', 'dissabte'];
  const DOWS = ['dg', 'dl', 'dt', 'dc', 'dj', 'dv', 'ds'];
  const MON = ['gener', 'febrer', 'març', 'abril', 'maig', 'juny', 'juliol', 'agost', 'setembre', 'octubre', 'novembre', 'desembre'];
  const day = (n) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + n); return d; };
  const cap = (s) => s[0].toUpperCase() + s.slice(1);
  const dayLabel = (n) => (n === 0 ? 'Avui' : n === 1 ? 'Demà' : `${cap(DOW[day(n).getDay()])} ${day(n).getDate()}`);
  const longDate = (d = new Date()) => `${cap(DOW[d.getDay()])}, ${d.getDate()} ${['març', 'abril', 'agost', 'octubre'].includes(MON[d.getMonth()]) ? 'd’' : 'de '}${MON[d.getMonth()]}`;
  const hhmm = (d = new Date()) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  const greet = () => { const h = new Date().getHours(); return h < 6 ? 'Bona nit' : h < 14 ? 'Bon dia' : h < 20 ? 'Bona tarda' : 'Bon vespre'; };

  const events = [
    { id: 'passeig', d: 0, h: '10:00', end: '11:30', cat: 'Natura', tone: 'mint', t: 'Passeig a ritme lent pel riu', l: 'Pont vell', going: 18, first: true, x: 'El grup espera cinc minuts. El ritme el marca qui va més a poc a poc. A la meitat hi ha bancs.' },
    { id: 'tauletes', d: 0, h: '17:00', end: '18:30', cat: 'Gent gran', tone: 'coral', t: 'Tarda de tauletes i mòbils', l: 'Biblioteca', going: 12, first: true, x: 'Entres, et donen un cafè i et presenten qui t’ajudarà. Pots preguntar el mateix deu vegades.' },
    { id: 'contes', d: 1, h: '17:30', end: '18:15', cat: 'Famílies', tone: 'sky', t: 'Contes amb llanterna', l: 'Biblioteca infantil', going: 29, x: 'Infants a terra amb coixins, famílies al darrere. Uns 40 minuts.' },
    { id: 'cor', d: 1, h: '20:00', end: '21:30', cat: 'Cultura', tone: 'sun', t: 'Assaig obert del cor', l: 'Casal cultural', going: 23, first: true, x: 'Seus al fons. Al descans et pregunten si vols provar. Dir que no també està bé.' },
    { id: 'sopar', d: 3, h: '20:30', end: '22:30', cat: 'Veïnat', tone: 'lilac', t: 'Sopar de benvinguda als nous veïns', l: 'Casal cultural', going: 41, first: true, x: 'Algú t’espera a la porta i et presenta gent. Taules llargues, sense lloc fix.' },
    { id: 'mercat', d: 4, h: '10:00', end: '20:00', cat: 'Mercat', tone: 'sun', t: 'Mercat d’hivern de productors', l: 'Plaça major', going: 134, x: 'Al matí és més tranquil. A la tarda hi ha música.' },
    { id: 'ball', d: 5, h: '17:00', end: '19:30', cat: 'Gent gran', tone: 'coral', t: 'Ball de diumenge', l: 'Casal de la gent gran', going: 52, x: 'Comença amb peces lentes. Hi ha cadires a tot el voltant.' },
    { id: 'reparem', d: 7, h: '10:00', end: '13:00', cat: 'Veïnat', tone: 'lilac', t: 'Reparem junts', l: 'Taller del casal', going: 15, first: true, x: 'T’apuntes a l’entrada i esperes torn amb un cafè.' },
  ];
  const posts = [
    { id: 'p1', a: 'Irene V.', i: 'IV', tone: 'sky', badge: 'Nova veïna', ch: 'Hola, sóc nova', m: 22, t: 'Fa un mes que vivim aquí amb la meva filla de 5 anys. Busquem un parc tranquil per les tardes i, si hi ha altres famílies noves, ens encantaria conèixer-vos.', th: 21, r: [['RM', 'coral', 'Rosa', 'Els divendres som unes quantes famílies al parc del riu cap a les sis.']] },
    { id: 'p2', a: 'Toni R.', i: 'TR', tone: 'coral', ch: 'Avís', m: 70, t: 'Ojo: esta mañana hay obras en la entrada del pueblo y un solo carril. Salid con tiempo.', th: 36, r: [['MF', 'lilac', 'Marta', 'Gràcies! A les 8 ja hi havia cua.']] },
    { id: 'p3', a: 'Associació de veïns', i: 'AV', tone: 'mint', badge: 'Entitat', ch: 'Dono un cop de mà', m: 1500, t: 'Busquem dues persones per acompanyar a comprar, un matí a la setmana, veïnes grans que viuen soles.', th: 48, r: [['IV', 'sky', 'Irene', 'Jo puc els dimecres!']] },
    { id: 'p4', a: 'Montse C.', i: 'MC', tone: 'lilac', ch: 'Perdut i trobat', m: 200, t: 'He trobat unes ulleres de lectura amb funda vermella al banc de la plaça.', th: 14, r: [] },
  ];
  const shops = [
    { id: 'forn', n: 'Forn de l’Alba', k: 'Forn', tone: 'sun', o: [['07:00', '14:00'], ['17:00', '20:00']], offer: 'Dijous: segona barra a meitat de preu' },
    { id: 'cafe', n: 'Cafè de la Plaça', k: 'Bar', tone: 'coral', o: [['07:00', '20:00']], offer: 'Menú del dia: 13,50 €', featured: true },
    { id: 'hort', n: 'L’Hort Verd', k: 'Fruita', tone: 'mint', o: [['08:30', '13:30'], ['17:00', '20:00']], offer: 'Entrega gratis a gent gran' },
    { id: 'taverna', n: 'La Taverna del Pont', k: 'Tapes', tone: 'coral', o: [['12:00', '16:00'], ['19:30', '23:00']], offer: 'Dimecres: tapa + canya, 4 €' },
  ];
  const proposal = { t: 'Més bancs a la pujada del centre', n: 212, goal: 250 };
  const bus = ['06:50', '07:55', '08:40', '09:55', '11:00', '12:05', '13:10', '14:50', '16:25', '17:20', '18:45', '19:45'];
  const nextBus = (k = 3) => bus.filter((b) => b >= hhmm()).slice(0, k);
  const minsTo = (b) => { const [h, m] = b.split(':').map(Number); const n = new Date(); return h * 60 + m - (n.getHours() * 60 + n.getMinutes()); };
  const isOpen = (s) => s.o.some(([a, b]) => hhmm() >= a && hhmm() < b);
  const t24 = (x) => x.replace(':', '.');

  const norm = (s) => s.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();
  const has = (q, ...w) => w.some((x) => new RegExp(`(^|[^a-z0-9])${x}`).test(q));
  function answer(raw) {
    const q = norm(raw);
    if (has(q, 'bus', 'autobus', 'manresa')) {
      const n = nextBus();
      return { text: n.length ? `El pròxim bus cap a Manresa surt a les **${t24(n[0])} h** (d’aquí a ${minsTo(n[0])} min).\nDesprés: ${n.slice(1).map(t24).join(', ')} h.\n\nHorari d’exemple del prototip.` : 'Avui ja no surten més busos cap a Manresa. El primer de demà és a les **6.50 h**.', actions: [] };
    }
    if (has(q, 'empadron', 'padro', 'padron')) return { text: '**Empadronar-te** és la porta de tot: metge, escola i ajuts.\n- Porta el DNI o NIE i el contracte de lloguer.\n- Fes-ho en línia o a l’oficina d’atenció ciutadana.\n- Guarda el justificant: te’l demanaran al CAP.', actions: [['Guia pas a pas', '#jo']] };
    if (has(q, 'moble', 'mueble', 'sofa', 'matalas', 'colchon')) return { text: 'Els mobles es recullen **a la porta**, demanant-ho amb una setmana d’antelació. Deixa’ls la nit abans, al costat de la porta.', actions: [] };
    if (has(q, 'farmac', 'guardia')) return { text: 'Farmàcia de guàrdia (dada d’exemple): **Farmàcia de la Plaça**, fins demà a les 9.00 h.\nSi és una urgència, truca al **112**.', actions: [['Truca al 112', 'tel:112']] };
    if (has(q, 'sopar', 'cenar', 'obert', 'abierto', 'menjar', 'comer', 'tapes', 'pa(?![a-z])', 'forn', 'cafe')) {
      const o = shops.filter(isOpen);
      return { text: (o.length ? 'Obert ara, segons el que diuen els mateixos negocis:\n' : 'Ara està tot tancat. Aquests obren aviat:\n') + (o.length ? o : shops).map((s) => `- **${s.n}** · ${s.offer}`).join('\n'), actions: [] };
    }
    if (has(q, 'que fer', 'que faig', 'que hacer', 'agenda', 'cap de setmana', 'fin de semana', 'avui', 'hoy', 'activitat')) {
      return { text: 'Això és el que hi ha aviat:\n' + events.slice(0, 4).map((e) => `- **${e.t}** · ${dayLabel(e.d)}, ${t24(e.h)} h · ${e.l}`).join('\n') + '\n\nA cada activitat t’expliquem què passarà i pots dir que busques companyia.', actions: [['Obre l’agenda', '#agenda']] };
    }
    if (has(q, 'nou', 'nueva', 'nuevo', 'acabo', 'arribat', 'gent', 'amics', 'amigos')) return { text: 'Benvingut! Aquesta setmana hi ha un **sopar de benvinguda** on algú t’esperarà a la porta per presentar-te gent. I tens una guia dels primers 30 dies.', actions: [['Sopar de benvinguda', '#agenda/sopar']] };
    if (has(q, '112', 'emergenc', 'urgenc', 'policia')) return { text: 'En una emergència, truca al **112**: gratuït i 24 hores.', actions: [['Truca al 112', 'tel:112']] };
    return { text: 'Encara no tinc aquesta resposta: funciono en **mode demostració**, sense cap model d’IA connectat, i només responc amb el que hi ha a la plataforma.\n\nPots preguntar-ho a la comunitat: algú del poble ho sabrà.', actions: [['Pregunta-ho a la comunitat', '#comunitat']] };
  }
  async function stream(text, onChunk, signal) {
    const wait = (ms) => new Promise((res, rej) => { const id = setTimeout(res, ms); signal && signal.addEventListener('abort', () => { clearTimeout(id); rej(new Error('abort')); }, { once: true }); });
    await wait(500);
    let out = '';
    for (const w of text.match(/\S+\s*/g) || []) { await wait(14 + Math.random() * 24); out += w; onChunk(out); }
    return out;
  }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const md = (t) => {
    const lines = esc(t).split('\n'); let h = ''; let ul = false;
    for (const l of lines) {
      const f = l.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      if (l.startsWith('- ')) { if (!ul) { h += '<ul>'; ul = true; } h += `<li>${f.slice(2)}</li>`; }
      else { if (ul) { h += '</ul>'; ul = false; } if (l.trim()) h += `<p>${f}</p>`; }
    }
    return h + (ul ? '</ul>' : '');
  };
  let tt;
  const toast = (m) => { const el = document.getElementById('toast'); if (!el) return; el.textContent = m; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2400); };
  const initials = (n) => { const p = n.trim().split(/\s+/); return ((p[0] || '')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); };
  const ago = (m) => (m < 60 ? `fa ${m} min` : m < 1440 ? `fa ${Math.round(m / 60)} h` : m < 2880 ? 'ahir' : `fa ${Math.round(m / 1440)} dies`);
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  return { state, events, posts, shops, proposal, nextBus, minsTo, isOpen, t24, dayLabel, longDate, greet, answer, stream, md, esc, toast, initials, ago, day, DOWS, reduced, hhmm };
})();

const S = SURIA, $ = (q) => document.querySelector(q), view = $('#view');
document.documentElement.dataset.text = S.state.get().text;
let tab = 'plans', idx = 0;
const tones = { sun: 'var(--lemon)', coral: 'var(--tomato)', sky: 'var(--sky)', mint: 'var(--mint)', lilac: 'var(--lilac)' };
const plans = [
  ...S.events.map((e) => ({ k: 'ev', id: e.id, kind: e.first ? 'Ideal per a la 1a vegada' : e.cat, c: tones[e.tone], h: e.t, when: `${S.dayLabel(e.d)} · ${S.t24(e.h)} h`, p: `${e.l} · ${e.going} veïns hi van`, x: e.x })),
  { k: 'shop', id: 'forn', kind: 'Oferta del poble', c: 'var(--lemon)', h: 'Segona barra a meitat de preu', when: 'Dijous · Forn de l’Alba', p: 'Ensenya el passaport i suma un segell.', x: 'Patrocinat pel comerç. Ho diem sempre.' },
  { k: 'help', id: 'p3', kind: 'Dona un cop de mà', c: 'var(--mint)', h: 'Acompanyar a comprar un matí a la setmana', when: 'Associació de veïns', p: 'Una hora, sense compromís llarg.', x: 'Una veïna gran que viu sola t’ho agrairà molt.' },
];
const stampsOf = () => { const s = S.state.get(); return Object.keys(s.going).length + Object.keys(s.thanks).length + (s.visits || 0) + Object.keys(s.helps || {}).length; };
function updCount() { $('#cnt').textContent = `★ ${stampsOf()}`; }
function card(p, depth) { return `<article class="pc stk" data-depth="${depth}" style="--c:${p.c};z-index:${10 - depth}" ${depth === 0 ? 'id="top" aria-live="polite"' : 'aria-hidden="true"'}><span class="stamp-hint yes">HI VAIG</span><span class="stamp-hint no">ARA NO</span><span class="kind">${p.kind}</span><h2>${p.h}</h2><span class="when">${p.when}</span><p>${p.p}</p><p class="x"><b>Què passarà:</b> ${p.x}</p></article>`; }
function plansView() {
  const left = plans.slice(idx, idx + 3);
  if (!left.length) return `<div class="empty"><h1 class="big">Ja ho has vist tot.</h1><p class="sub">Tens ${Object.keys(S.state.get().going).length} plans guardats. Demà n’hi haurà de nous.</p><button class="btn stk" id="restart">Torna a començar</button></div>`;
  return `<h1 class="big">${S.greet()}${S.state.get().user ? ', ' + S.esc(S.state.get().user.n.split(' ')[0]) : ''}.</h1><p class="sub">${plans.length - idx} plans al poble aquesta setmana. <span class="demo">Exemple</span></p>
    <div class="deck" id="deck">${left.map((p, i) => card(p, i)).reverse().join('')}</div>
    <div class="decide"><button class="stk n" data-dec="no">✕ Ara no</button><button class="stk s" data-dec="save" aria-label="Desa per més tard">★</button><button class="stk y" data-dec="yes">✓ Hi vaig</button></div>`;
}
function passaportView() {
  const s = S.state.get(), n = stampsOf(), goal = 6;
  const got = [...Object.keys(s.going).map((id) => ({ t: S.events.find((e) => e.id === id)?.t.split(' ').slice(0, 2).join(' ') || 'Activitat', c: 'var(--lemon)' })), ...Object.keys(s.thanks).map(() => ({ t: 'Gràcies', c: 'var(--mint)' })), ...Array.from({ length: s.visits || 0 }, () => ({ t: 'Botiga', c: 'var(--tomato)' })), ...Object.keys(s.helps || {}).map(() => ({ t: 'Ajuda', c: 'var(--sky)' }))];
  return `<h1 class="big">El teu passaport</h1><p class="sub">Cada cosa que fas al poble suma un segell. <span class="demo">Exemple</span></p>
    <div class="grid">${Array.from({ length: 12 }, (_, i) => got[i] ? `<div class="seal got" style="--c:${got[i].c};--r:${(i * 37) % 17 - 8}deg"><span><b>★</b>${got[i].t}</span></div>` : `<div class="seal">${['Ves a una activitat', 'Compra al poble', 'Dona les gràcies', 'Ajuda un veí'][i % 4]}</div>`).join('')}</div>
    <div class="reward stk"><b style="font:900 1.25rem var(--display)">${n >= goal ? 'Ja tens el cafè!' : `${goal - Math.min(n, goal)} segells per a un cafè`}</b><div class="bar"><span style="width:${Math.min(100, n / goal * 100)}%"></span></div><p style="font-size:.9375rem">Al Cafè de la Plaça, que paga el premi. Els comerços patrocinen els premis: així es finança la plataforma sense anuncis.</p></div>
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="btn stk" id="scan">Escaneja a una botiga</button><button class="btn alt stk" id="me">El meu compte</button></div>`;
}
function gentView() {
  const people = [['IV', 'Irene V.', 'Nova veïna · filla de 5 anys', 'També va al <b>Sopar de benvinguda</b>.', 'var(--sky)'], ['PG', 'Pau G.', 'Hi viu de sempre · fa de padrí', 'Pot ensenyar-te el poble un dissabte.', 'var(--lemon)'], ['KB', 'Karim B.', 'Nou veí · li agrada caminar', 'Va al <b>Passeig a ritme lent</b>.', 'var(--mint)']];
  return `<h1 class="big">Gent per anar-hi junts</h1><p class="sub">Ningú hauria d’anar sol a la primera. <span class="demo">Exemple</span></p>
    ${people.map(([i, n, d, w, c]) => `<article class="person stk"><span class="face" style="--c:${c}">${i}</span><span><b>${n}</b><span class="tiny">${d}</span><br>${w}</span><div class="acts"><button class="btn stk" data-hi="${n}">👋 Saluda</button></div></article>`).join('')}
    <h2 style="font:900 1.5rem var(--display);margin-top:26px">Al poble se’n parla</h2>
    ${S.posts.slice(0, 3).map((p) => `<article class="post stk"><b>${S.esc(p.a)} <span class="tiny">· ${S.ago(p.m)}</span></b><p>${S.esc(p.t)}</p><div><button class="btn alt stk" data-thx="${p.id}" style="min-height:40px">♥ Gràcies ${p.th + (S.state.get().thanks[p.id] ? 1 : 0)}</button></div></article>`).join('')}`;
}
function preguntaView() {
  return `<h1 class="big">Pregunta</h1><p class="sub">Com ho preguntaries a un veí. <span class="demo">Mode demostració</span></p>
    <form class="ask" id="af"><label for="aq" style="position:absolute;left:-9999px">Pregunta</label><input id="aq" placeholder="Què faig aquest cap de setmana?" autocomplete="off"><button class="btn stk">↑</button></form>
    <div class="chips">${['Quan surt el bus?', 'Com m’empadrono?', 'On puc sopar?'].map((q) => `<button class="stk" data-q="${q}">${q}</button>`).join('')}</div><div id="log" role="log" aria-live="polite"></div>`;
}
function render() {
  view.innerHTML = { plans: plansView, passaport: passaportView, gent: gentView, pregunta: preguntaView }[tab]();
  document.querySelectorAll('[data-tab]').forEach((b) => (b.dataset.tab === tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current')));
  updCount(); if (tab === 'plans') drag();
}
function sheet(html) { $('#sbody').innerHTML = html + '<button class="btn alt stk" id="close">Tanca</button>'; $('#sheet').classList.add('on'); setTimeout(() => $('#sbody').querySelector('input,button')?.focus(), 50); }
const close = () => $('#sheet').classList.remove('on');
function needUser(then) {
  if (S.state.get().user) return false;
  sheet(`<h2 style="font:900 2rem var(--display)">Com et diuen?</h2><p>Per guardar els teus segells i que la gent sàpiga qui hi va.</p><form id="si" style="display:grid;gap:10px"><label for="nm" style="font-weight:700">Nom i cognom</label><input id="nm" autocomplete="name" placeholder="Marta Puig"><button class="btn stk">Entra</button></form>`);
  $('#si').onsubmit = (e) => { e.preventDefault(); const n = $('#nm').value.trim(); if (n.length < 2) return; S.state.set((s) => { s.user = { n, i: S.initials(n) }; }); close(); S.toast(`Hola, ${n.split(' ')[0]}!`); then && then(); render(); };
  return true;
}
function decide(d) {
  const p = plans[idx]; if (!p) return;
  const go = () => {
    if (d === 'yes') { S.state.set((s) => { if (p.k === 'ev') s.going[p.id] = 1; else if (p.k === 'help') { s.helps = s.helps || {}; s.helps[p.id] = 1; } else s.visits = (s.visits || 0) + 1; }); S.toast('+1 segell ★'); }
    if (d === 'save') S.toast('Desat per a més tard');
    const top = $('#top'); if (top && !S.reduced()) { top.style.transform = d === 'no' ? 'translateX(-130%) rotate(-18deg)' : d === 'yes' ? 'translateX(130%) rotate(18deg)' : 'translateY(-120%)'; top.style.opacity = 0; }
    setTimeout(() => { idx++; render(); }, S.reduced() ? 0 : 280);
  };
  if (d === 'yes' && needUser(go)) return;
  go();
}
function drag() {
  const top = $('#top'); if (!top) return;
  let x0 = null, dx = 0;
  top.onpointerdown = (e) => { x0 = e.clientX; top.setPointerCapture(e.pointerId); top.style.transition = 'none'; };
  top.onpointermove = (e) => { if (x0 === null) return; dx = e.clientX - x0; top.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`; top.querySelector('.yes').style.opacity = Math.max(0, dx / 120); top.querySelector('.no').style.opacity = Math.max(0, -dx / 120); };
  top.onpointerup = () => { top.style.transition = ''; if (Math.abs(dx) > 110) decide(dx > 0 ? 'yes' : 'no'); else { top.style.transform = ''; top.querySelectorAll('.stamp-hint').forEach((h) => (h.style.opacity = 0)); } x0 = null; dx = 0; };
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; render(); scrollTo(0, 0); return; }
  if (b.dataset.dec) { decide(b.dataset.dec); return; }
  if (b.id === 'restart') { idx = 0; render(); return; }
  if (b.id === 'scan') { if (needUser()) return; S.state.set((s) => { s.visits = (s.visits || 0) + 1; }); S.toast('Segell de botiga ★ (simulat)'); render(); return; }
  if (b.id === 'cnt') { tab = 'passaport'; render(); return; }
  if (b.dataset.hi) { if (needUser()) return; S.toast(`Hem dit a ${b.dataset.hi.split(' ')[0]} que la saludes 👋`); b.textContent = '✓ Saludat'; return; }
  if (b.dataset.thx) { if (needUser()) return; const id = b.dataset.thx; S.state.set((s) => { s.thanks[id] ? delete s.thanks[id] : (s.thanks[id] = 1); }); render(); return; }
  if (b.dataset.q) { ask(b.dataset.q); return; }
  if (b.id === 'me') { if (needUser()) return; sheet(`<h2 style="font:900 2rem var(--display)">${S.esc(S.state.get().user.n)}</h2><p style="font-weight:700">Mida del text</p><div style="display:flex;gap:8px">${[['m', 'A'], ['l', 'A+'], ['xl', 'A++']].map(([k, l]) => `<button class="btn alt stk" data-size="${k}" aria-pressed="${S.state.get().text === k}">${l}</button>`).join('')}</div><button class="btn alt stk" id="logout">Surt</button>`); return; }
  if (b.dataset.size) { S.state.set((s) => { s.text = b.dataset.size; }); document.documentElement.dataset.text = b.dataset.size; return; }
  if (b.id === 'logout') { S.state.set((s) => { s.user = null; }); close(); render(); return; }
  if (b.id === 'close') close();
});
async function ask(q) {
  q = q.trim(); if (!q) return; const log = $('#log'); log.insertAdjacentHTML('beforeend', `<div class="msg q stk">${S.esc(q)}</div>`);
  const a = S.answer(q), el = document.createElement('div'); el.className = 'msg stk'; el.textContent = '…'; log.append(el);
  await S.stream(a.text, (t) => { el.innerHTML = S.md(t); }); el.scrollIntoView({ block: 'nearest' });
}
document.addEventListener('submit', (e) => { if (e.target.id === 'af') { e.preventDefault(); const v = $('#aq').value; $('#aq').value = ''; ask(v); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); if (tab === 'plans' && !e.target.closest('input')) { if (e.key === 'ArrowRight') decide('yes'); if (e.key === 'ArrowLeft') decide('no'); } });
render();
</script>
