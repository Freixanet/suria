resum:
  ca: En línia, o a l’OAC (Casa de la Vila), de dilluns a divendres de 9.00 a 14.00 h; dijous, també de 16.00 a 18.30 h.
  es: En línea, o en la OAC (Casa de la Vila), de lunes a viernes de 9:00 a 14:00 h; los jueves, también de 16:00 a 18:30 h.
text:
  ca: Sol·licitud d’alta al Padró, en línia o a l’OAC (planta baixa de la Casa de la Vila, c. Ernest Solvay, 13). De dilluns a divendres feiners, 9.00–14.00 h; dijous, també 16.00–18.30 h.
  es: Solicitud de alta en el Padrón, en línea o en la OAC (planta baja de la Casa de la Vila, c. Ernest Solvay, 13). De lunes a viernes laborables, 9:00–14:00 h; los jueves, también 16:00–18:30 h.
