name: Publish Súria to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'work/**'
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      - '.impeccable/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'DESIGN.md'
      - 'PRODUCT.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SURIA_SITE: ${{ steps.pages.outputs.origin }}
          SURIA_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
